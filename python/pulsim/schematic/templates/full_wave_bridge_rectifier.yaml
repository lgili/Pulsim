# Full-wave (Graetz) diode bridge rectifier.
#
# Diodes are drawn vertical with rotation=180 so the anode (terminal 0)
# sits at the BOTTOM of each symbol, matching the typical netlist where
# D.anode is the input current source. The bridge sits in a 2×2 grid:
#
#                       DC+ rail
#                ┌──────┬──────┐
#               D1↑    D3↑       <- cathodes meet at DC+
#                │      │
#       AC+ ─────┤      ├───── AC-
#                │      │
#               D2↑    D4↑       <- cathodes meet at AC+/AC-
#                │      │
#                └──────┴──────┘
#                       DC- rail (gnd)
#
# The AC source sits to the LEFT, feeding the AC+ / AC- mid-rails.
# Cout and Rload sit to the RIGHT between DC+ and ground.

name: full_wave_bridge_rectifier
quality: draft
canvas:
  width:  240
  height: 160
slots:
  source:             { x: 0.10, y: 0.50, rotation: 0   }
  rectifier_diode_a:  { x: 0.40, y: 0.30, rotation: 180 }   # D1 upper-left
  rectifier_diode_b:  { x: 0.40, y: 0.70, rotation: 180 }   # D2 lower-left
  rectifier_diode_c:  { x: 0.60, y: 0.30, rotation: 180 }   # D3 upper-right
  rectifier_diode_d:  { x: 0.60, y: 0.70, rotation: 180 }   # D4 lower-right
  filter_capacitor:   { x: 0.83, y: 0.50, rotation: 0   }
  load_resistor:      { x: 0.95, y: 0.50, rotation: 0   }
