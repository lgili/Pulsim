# GaN Systems GS66508T — 650 V GaN HEMT, 50 mΩ.
# SYNTHETIC ILLUSTRATION — shapes only, not vendor data; see provenance.
# Datasheet rev 2020-09. PDFN package.
#
# Note: GaN HEMTs have NO body diode (Q_rr = 0) — set the embedded
# diode's Q_rr_table to zero.
provenance:
  source: synthetic
  source_ref: "pulsim illustration (no vendor source)"
  retrieved: "2026-05-10"
  method: synthetic
  note: >-
    ILLUSTRATIVE ONLY. The curves and tables in this file (switching
    energies, on-state tables, Coss/Ciss/Crss points, B-H points, core
    geometry, Steinmetz and Jiles-Atherton sets) are plausible shapes
    written for examples, not the vendor's published data: the
    switching energies are straight lines through the origin, which no
    datasheet curve is. Scalar ratings are datasheet headline values;
    package and identity fields are unverified. pulsim.lib refuses to
    resolve this part by number unless allow_synthetic=True. For real
    numbers import the vendor's PLECS thermal file
    (pulsim.lib.import_plecs_xml) or transcribe the datasheet with
    provenance into a directory on PULSIM_PARTS_PATH.
class: mosfet
vendor: GaNSystems
part: GS66508T

V_th_25c:           1.7              # GaN low-Vth signature
V_th_temp_coef:    -2e-3              # nearly flat over T
R_ds_on_25c:        0.050             # 50 mΩ
R_ds_on_temp_coef:  4e-3
V_ds_max:           650.0
I_dss_25c:          1.0e-7

# GaN has small, very Vds-flat capacitances — almost ideal switch.
Coss:
  - { V:   0.0, C: 350.0e-12 }
  - { V:  20.0, C:  85.0e-12 }
  - { V: 100.0, C:  65.0e-12 }
  - { V: 400.0, C:  60.0e-12 }
  - { V: 650.0, C:  56.0e-12 }
Ciss:
  - { V:   0.0, C: 260.0e-12 }
  - { V: 650.0, C: 260.0e-12 }
Crss:
  - { V:   0.0, C:  10.0e-12 }
  - { V:  20.0, C:   2.0e-12 }
  - { V: 650.0, C:   1.0e-12 }

# Switching energies at 400 V bus, 25 °C — GaN is the loss champion
Eon:
  x: [10.0, 20.0, 30.0]
  y: [200.0, 400.0]
  values: [3.0e-6, 6.0e-6, 9.0e-6,
           6.0e-6, 12.0e-6, 18.0e-6]
Eoff:
  x: [10.0, 20.0, 30.0]
  y: [200.0, 400.0]
  values: [2.0e-6, 4.0e-6, 6.0e-6,
           4.0e-6, 8.0e-6, 12.0e-6]
