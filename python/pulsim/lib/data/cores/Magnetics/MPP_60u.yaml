# Magnetics Inc MPP (Molypermalloy) µ=60 distributed-air-gap powder core.
# SYNTHETIC ILLUSTRATION — shapes only, not vendor data; see provenance.
#
# Datasheet reference: Magnetics MPP catalog (rev 2019).

class: core
provenance:
  source: synthetic
  source_ref: "pulsim illustration (no vendor source)"
  retrieved: "2026-05-10"
  method: synthetic
  note: >-
    ILLUSTRATIVE ONLY. The curves and tables in this file (switching
    energies, on-state tables, Coss/Ciss/Crss points, B-H points, core
    geometry, Steinmetz and Jiles-Atherton sets) are plausible shapes
    written for examples, not the vendor's published data: the
    switching energies are straight lines through the origin, which no
    datasheet curve is. Scalar ratings are datasheet headline values;
    package and identity fields are unverified. pulsim.lib refuses to
    resolve this part by number unless allow_synthetic=True. For real
    numbers import the vendor's PLECS thermal file
    (pulsim.lib.import_plecs_xml) or transcribe the datasheet with
    provenance into a directory on PULSIM_PARTS_PATH.
vendor: Magnetics
material: MPP_60u
geometry:
  area_m2: 0.85e-4
  path_length_m: 5.5e-2
bh_curve:
  - { H: -8000, B: -0.50 }
  - { H: -3000, B: -0.45 }
  - { H:  -500, B: -0.20 }
  - { H:     0, B:  0.00 }
  - { H:   500, B:  0.20 }
  - { H:  3000, B:  0.45 }
  - { H:  8000, B:  0.50 }
steinmetz:
  k:     2.5e-3
  alpha: 1.4
  beta:  2.4
