# TEMPORARY: diagnostic for the Windows-only timeout of
# test_fx1_ten_branch_form_bridges_run_under_the_rule (group-f.md). Removed before merge.
name: windows-ten-bridges-diag

on:
  push:
    branches: [ci/windows-ten-bridges-diag]
  workflow_dispatch:

jobs:
  diag:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -o Acquire::Retries=5 update
          sudo apt-get -o Acquire::Retries=5 install -y cmake ninja-build libeigen3-dev gcc-13 g++-13
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: pip install cmake ninja
      - name: Build and install package (as ci.yml python-tests)
        env:
          CC: ${{ runner.os == 'Linux' && 'gcc-13' || '' }}
          CXX: ${{ runner.os == 'Linux' && 'g++-13' || '' }}
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ runner.os == 'Linux' && '2' || '4' }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy scipy
          pip install ".[dev]" --config-settings=build-dir=skbuild
      - name: Build configuration
        shell: bash
        run: |
          grep -E "CMAKE_GENERATOR:|CMAKE_CXX_COMPILER:|CMAKE_CXX_FLAGS(_RELEASE)?:|CMAKE_BUILD_TYPE:" skbuild/CMakeCache.txt || true
          grep -o '"command": "[^"]*_pulsim[^"]*bindings[^"]*"' skbuild/compile_commands.json | head -c 3000 || true
      - name: Diagnostic
        working-directory: ${{ runner.temp }}
        run: python ${{ github.workspace }}/.github/diag/ten_bridges_diag.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-${{ matrix.os }}
          path: ${{ runner.temp }}/diag_results.jsonl
