name: Schematic smoke render

# Renders the canonical demo set (RC, buck, half-bridge PWM) via the
# `pulsim.schematic` netlistsvg backend and uploads the SVG + PNG
# artifacts so reviewers can eyeball the output without running locally.
#
# This is a fast, low-risk job: builds the Python wheel, invokes
# `ps.schematic.render` on three example YAMLs, and stops. Failures
# point at netlistsvg / analog skin / glyph regressions.

on:
  push:
    branches: [main, develop]
    paths:
      - 'python/pulsim/schematic/**'
      - 'python/bindings.cpp'
      - 'core/include/pulsim/v1/runtime_circuit.hpp'
      - 'package.json'
      - 'examples/*.yaml'
      - '.github/workflows/schematic-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'python/pulsim/schematic/**'
      - 'python/bindings.cpp'
      - 'core/include/pulsim/v1/runtime_circuit.hpp'
      - 'package.json'
      - 'examples/*.yaml'
      - '.github/workflows/schematic-smoke.yml'
  workflow_dispatch:

jobs:
  smoke-render:
    name: Render demo schematics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        # NOTE: gcc-13 (not clang-17) is the known-good toolchain for the
        # PULSIM_BUILD_PYTHON=ON build on ubuntu-24.04 — the default clang-17
        # + libstdc++-14 combination hits a `<tuple>` instantiation bug in
        # `std::unordered_map<std::string, double>` paths reached by
        # `_pulsim` bindings. The repository's `python-tests` job already
        # pins gcc-13 for the same reason; we mirror that choice here.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build gcc-13 g++-13 \
            libsuitesparse-dev libeigen3-dev librsvg2-bin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        # `pulsim/__init__.py` imports numpy at module load; the schematic
        # render path itself does not need scipy/networkx but the package
        # import must succeed before `pulsim.schematic.render(...)` can
        # be called.
        run: |
          python -m pip install --upgrade pip
          pip install numpy

      - name: Install elkjs (+ legacy netlistsvg for backward compat)
        # The Phase 5 default is python_native — only elkjs is actually
        # required at runtime. netlistsvg stays installed for one release
        # so users opting into PULSIM_SCHEMATIC_BACKEND=netlistsvg still
        # work; the package will be dropped once the deprecation window
        # closes.
        run: npm install

      - name: Configure CMake + build pulsim
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DPULSIM_BUILD_PYTHON=ON \
            -DPython3_EXECUTABLE=$(which python3)
          cmake --build build --target _pulsim -j

      - name: Render demo set
        # The v1 YAML examples (`examples/rc_circuit.yaml`, etc.) were
        # retired in pulsim 1.0.0 — `YamlParser` is gone. We exercise
        # the same surface area with the v2 `CircuitBuilder` API
        # directly, building the three canonical topologies and
        # rendering each via `pulsim.schematic.render_layout`. Use
        # `compute_layout` (which dispatches through the topology
        # recognizer + template instantiator) plus the native SVG
        # renderer — the same path the per-topology tests cover.
        run: |
          mkdir -p build/schematic_demo
          PYTHONPATH=build/python python3 - <<'PY'
          import pulsim as p
          import pulsim.schematic as sch


          def build_rc_circuit():
              b = p.CircuitBuilder()
              b.add_voltage_source("Vin", "vin", "gnd", 5.0)
              b.add_resistor("R", "vin", "vout", 1e3)
              b.add_capacitor("C", "vout", "gnd", 1e-6)
              return b


          def build_buck_converter():
              b = p.CircuitBuilder()
              b.add_voltage_source("Vin",   "vin", "gnd", 24.0)
              b.add_switch        ("Q",     "vin", "sw",  g_on=1e3, g_off=1e-9)
              b.add_diode         ("D",     "gnd", "sw",  g_on=1e3, g_off=1e-9,
                                   V_th=0.0)
              b.add_inductor      ("L",     "sw",  "vout", 100e-6)
              b.add_capacitor     ("Cout",  "vout","gnd",  100e-6)
              b.add_resistor      ("Rload", "vout","gnd",  5.0)
              return b


          def build_half_bridge_pwm():
              b = p.CircuitBuilder()
              b.add_voltage_source("Vdc", "vdc", "gnd", 48.0)
              b.add_switch       ("Qh",   "vdc", "mid", g_on=1e3, g_off=1e-9)
              b.add_switch       ("Ql",   "mid", "gnd", g_on=1e3, g_off=1e-9)
              return b


          for stem, builder in (
              ("rc_circuit",     build_rc_circuit),
              ("buck_converter", build_buck_converter),
              ("half_bridge_pwm", build_half_bridge_pwm),
          ):
              ckt = builder()
              layout = sch.compute_layout(ckt)
              svg = sch.render_layout(layout, f"build/schematic_demo/{stem}.svg",
                                       format="svg")
              try:
                  png = sch.render_layout(layout, f"build/schematic_demo/{stem}.png",
                                           format="png")
                  png_size = png.stat().st_size
              except ImportError:
                  png_size = 0  # cairosvg not installed → svg-only is fine
              print(f"  {stem}: svg={svg.stat().st_size}B png={png_size}B")
          PY

      - name: Upload schematic artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schematic-demo
          path: build/schematic_demo/
          if-no-files-found: error
          retention-days: 14
