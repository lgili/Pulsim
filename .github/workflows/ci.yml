name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  # =============================================================================
  # C++ Build and Test with Multiple Compilers
  # =============================================================================
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux with Clang 17 (primary - recommended for C++23)
          - name: "Linux Clang 17"
            os: ubuntu-24.04
            compiler: clang
            cc: clang-17
            cxx: clang++-17
            build_type: Release
            install_cmd: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build clang-17 libc++-17-dev libc++abi-17-dev libeigen3-dev

          # Linux with Clang 18 (latest)
          - name: "Linux Clang 18"
            os: ubuntu-24.04
            compiler: clang
            cc: clang-18
            cxx: clang++-18
            build_type: Release
            install_cmd: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build clang-18 libc++-18-dev libc++abi-18-dev libeigen3-dev

          # Linux with GCC 13 (fallback)
          - name: "Linux GCC 13"
            os: ubuntu-24.04
            compiler: gcc
            cc: gcc-13
            cxx: g++-13
            build_type: Release
            install_cmd: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build gcc-13 g++-13 libeigen3-dev

          # macOS ARM64 (Apple Silicon)
          # Note: macos-13 (Intel) removed - Apple has transitioned to ARM,
          # and Intel runners frequently timeout in GitHub Actions queue
          - name: "macOS ARM64 (Apple Silicon)"
            os: macos-14
            compiler: appleclang
            cc: clang
            cxx: clang++
            build_type: Release
            install_cmd: brew install cmake ninja eigen

          # Linux Debug build with sanitizers
          - name: "Linux Debug + Sanitizers"
            os: ubuntu-24.04
            compiler: clang
            cc: clang-17
            cxx: clang++-17
            build_type: Debug
            sanitizers: ON
            build_parallel_level: 2
            install_cmd: |
              sudo apt-get update
              sudo apt-get install -y cmake ninja-build clang-17 libc++-17-dev libc++abi-17-dev libeigen3-dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.install_cmd }}

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DPULSIM_BUILD_TESTS=ON \
            -DPULSIM_SANITIZERS=${{ matrix.sanitizers || 'OFF' }}

      - name: Build
        run: |
          cmake --build build --config ${{ matrix.build_type }} \
            --parallel ${{ matrix.build_parallel_level || env.CMAKE_BUILD_PARALLEL_LEVEL }}

      - name: Run C++ tests
        run: |
          cd build
          # Sanitizer builds have 10-20x runtime overhead.
          if [ "${{ matrix.sanitizers }}" = "ON" ]; then
            # libc++ on Linux can report alloc/dealloc mismatch false positives
            # for certain std::exception message paths under ASan.
            export ASAN_OPTIONS="alloc_dealloc_mismatch=0"
            ctest --output-on-failure --timeout 600
          else
            ctest --output-on-failure --timeout 120
          fi

  # =============================================================================
  # Python Tests
  # =============================================================================
  python-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang-17 libc++-17-dev libc++abi-17-dev libeigen3-dev gcc-13 g++-13

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja eigen

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pytest numpy scipy

      - name: Build and install package
        env:
          # On macOS, let CMake auto-detect AppleClang for ABI compatibility.
          # On Linux python jobs, use GCC 13 to avoid libstdc++14 regressions
          # seen in some third-party template instantiations.
          CC: ${{ runner.os == 'Linux' && 'gcc-13' || '' }}
          CXX: ${{ runner.os == 'Linux' && 'g++-13' || '' }}
          # Linux runners can OOM while compiling C++ extension dependencies
          # (yaml-cpp/Catch2) at high parallelism; keep this job stable.
          CMAKE_BUILD_PARALLEL_LEVEL: ${{ runner.os == 'Linux' && '2' || '4' }}
        run: |
          # Use non-editable install in CI to avoid import-time rebuilds with
          # transient pip build-env paths (Windows runner instability).
          pip install ".[dev]"

      - name: Run Python tests
        run: |
          pytest python/tests -v

  # =============================================================================
  # Code Quality
  # =============================================================================
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linters
        run: |
          pip install ruff

      - name: Run ruff
        run: |
          ruff check python/

  # =============================================================================
  # C++ Code Coverage (lcov → Codecov)
  # =============================================================================
  coverage:
    name: C++ Code Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc-13 g++-13 libeigen3-dev lcov

      - name: Configure CMake (coverage build)
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -B build-cov \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=gcc-13 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DPULSIM_BUILD_TESTS=ON \
            -DPULSIM_ENABLE_LTO=OFF \
            "-DCMAKE_CXX_FLAGS=--coverage" \
            "-DCMAKE_EXE_LINKER_FLAGS=--coverage"

      - name: Build
        run: cmake --build build-cov --parallel 2

      - name: Run C++ tests
        run: |
          cd build-cov
          ctest --output-on-failure --timeout 120

      - name: Capture coverage (core sources only)
        run: |
          # `--ignore-errors source,unused,empty,inconsistent` tolerates
          # the FetchContent-built Catch2 headers that lcov sometimes
          # can't resolve to a source file. Those entries get filtered
          # out anyway by the `--remove ... '*/Catch2/*'` step below,
          # so any unresolvable include just gets dropped instead of
          # failing the whole job. Same for yaml-cpp / Eigen.
          lcov --capture \
            --directory build-cov \
            --output-file coverage_raw.info \
            --gcov-tool gcov-13 \
            --no-external \
            --ignore-errors source,unused,empty,inconsistent
          lcov --remove coverage_raw.info \
            '*/tests/*' \
            '*/FetchContent/*' \
            '*/yaml-cpp/*' \
            '*/Catch2/*' \
            '*/eigen/*' \
            --output-file coverage.info \
            --ignore-errors source,unused,empty,inconsistent
          lcov --list coverage.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage.info
          flags: cpp-unittests
          name: pulsim-cpp-coverage
          fail_ci_if_error: false
