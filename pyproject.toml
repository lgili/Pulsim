[build-system]
requires = ["scikit-build-core>=0.5", "pybind11>=2.10"]
build-backend = "scikit_build_core.build"

[project]
name = "pulsim"
version = "1.6.2"
description = "High-performance circuit simulator for power electronics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Pulsim Authors", email = "pulsim@example.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
keywords = ["circuit", "simulation", "spice", "power electronics", "eda"]
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
jupyter = [
    "ipywidgets>=8.0",
    "matplotlib>=3.5",
    "plotly>=5.0",
]
data = [
    "pandas>=1.3",
    "xarray>=2022.0",
]
# JIT-compiled custom control blocks — see `pulsim.fast_block`.
# Optional because numba pulls ~80 MB of LLVM dependencies; users
# who never call `@p.fast_block` don't pay for it.
fast = [
    "numba>=0.58",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21.0",
    "PyYAML>=6.0",
    # benchmark CLI visual layer (Onda 1 of bench-tool refresh):
    # `benchmarks/_console.py` degrades gracefully when rich is absent,
    # so this stays a soft dev dep — CI without rich keeps working.
    "rich>=13.0",
]
docs = [
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.5,<9.6",
    "mike>=2.1,<3.0",
    "pymdown-extensions>=10.9,<11.0",
    "mkdocstrings[python]>=1.0",
    "griffe>=2.0",
]
schematic = [
    "schemdraw>=0.18,<1.0",
    "networkx>=3.0",
    "cairosvg>=2.7",      # SVG → PNG (optional; falls back to schemdraw native)
    "anthropic>=0.34",    # LLM topology classifier (opt-out via env var)
]
all = [
    "pulsim[jupyter,data,dev,schematic]",
]

[project.urls]
Homepage = "https://github.com/pulsim/pulsim-core"
Documentation = "https://pulsim.readthedocs.io"
Repository = "https://github.com/pulsim/pulsim-core"
Issues = "https://github.com/pulsim/pulsim-core/issues"

[tool.scikit-build]
cmake.args = [
    "-DPULSIM_BUILD_TESTS=OFF",
    "-DPULSIM_BUILD_PYTHON=ON",
]
wheel.packages = ["python/pulsim"]
editable.mode = "redirect"
editable.rebuild = true
build-dir = "build/{wheel_tag}"

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
Python3_EXECUTABLE = "{python}"
Python3_FIND_IMPLEMENTATIONS = "CPython"
Python3_FIND_STRATEGY = "LOCATION"

# =============================================================================
# macOS: Force AppleClang for Python ABI compatibility
# =============================================================================
# Homebrew's Clang uses a different libc++ than Python, causing runtime errors.
# We must use AppleClang (/usr/bin/clang++) which matches Python's ABI.
[[tool.scikit-build.overrides]]
if.platform-system = "darwin"
cmake.define.CMAKE_C_COMPILER = "/usr/bin/clang"
cmake.define.CMAKE_CXX_COMPILER = "/usr/bin/clang++"

[tool.pytest.ini_options]
testpaths = ["python/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["pulsim"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long — long URLs/docstrings are deliberate
    "E701",  # one-line ``if x: do_thing`` — used heavily in control.py
             # for compact state-machine transitions
    "E702",  # ``import a; import b`` — used in plot/scope inline imports
]
