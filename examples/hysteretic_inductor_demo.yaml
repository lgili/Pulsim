# Pulsim YAML showcase: hysteretic inductor — 50 V / 50 Hz mains
# excitation through a ferrite-N87 core (Jiles-Atherton). Phase 2.2.
#
# The hysteretic inductor is ONE Newton flux branch solved inside the
# loop (Phase 4 C.4): the magnetisation is part of the same solve as
# the current, at the same time level. No air-core L_0, no dummy
# source, no chain block — the material parameters below are what the
# device uses (the old loader ignored them and an observer re-stated
# them one step late, with its sign inverted).
#
# Use from Python:
#   loaded = pulsim.load_yaml_file("hysteretic_inductor_demo.yaml")
#   res = pulsim.simulate(loaded.builder, t_end=0.06, dt=2e-5)
#   i = res.i("L_core")           # winding current
#   H, M, B = pulsim._pulsim.ja_replay(100, 1e-4, 0.05, 0.0,
#                                      4.0e5, 50.0, 5e-5, 0.20, 30.0, 0.0, i)

circuit:
  devices:
    - type: sine_voltage_source
      name: Vs
      from: a
      to: gnd
      v_amplitude: 50.0
      frequency: 50.0

    - {type: resistor, name: Rs, from: a, to: n1, R: 1.0}

    # Ferrite-N87 core, 100 turns, 50 mm path, 1 cm² cross-section.
    # L_0 = N²·A·μ_0/l_m = 100²·1e-4·1.26e-6/0.05 ≈ 25.2 µH.
    - type: hysteretic_inductor
      name: L_core
      from: n1
      to: gnd
      Ms: 4.0e5    # saturation magnetisation [A/m]
      a: 50.0      # anhysteretic shape [A/m]
      alpha: 5e-5  # mean-field coupling
      c: 0.20      # reversibility (0..1)
      k: 30.0      # pinning coefficient [A/m]
      N_turns: 100
      l_m: 0.05    # mean magnetic path [m]
      A_core: 1e-4 # cross-section [m²]
