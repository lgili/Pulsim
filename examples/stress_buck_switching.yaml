# Pulsim v2 stress example: two-phase interleaved buck (48 V in).
#
# Migrated from the legacy `schema: pulsim-v1` format. The two ideal
# `vcswitch`es (driven by `pwm` sources on `ctrl0`/`ctrl1`) become
# gate-mask `switch` devices toggled by a runtime `switch_fn(t)`.
# Drive S0 (idx 0) and S1 (idx 1) at 20 kHz / 50% — interleave by
# 180° for ripple cancellation. Run with:
#
#   import pulsim as p
#   lc = p.load_yaml_file("examples/stress_buck_switching.yaml")
#   # ... build a switch_fn that toggles indices 0 and 1 ...
#   res = p.simulate(lc, t_end=0.01, dt=1.25e-7, switch_fn=sw)

circuit:
  devices:
    - type: voltage_source
      name: Vin
      from: vin
      to: gnd
      V: 48.0

    # ---- Phase 0 ----
    - type: switch          # was vcswitch S0 (ron=0.005, roff=1e6)
      name: S0
      from: vin
      to: sw0
      g_on: 200.0
      g_off: 1.0e-6

    - type: diode
      name: D0
      anode: gnd
      cathode: sw0
      g_on: 1.0e3
      g_off: 1.0e-9
      V_th: 0.7

    - type: resistor
      name: Rsnub0
      from: sw0
      to: gnd
      R: 1.0e6

    - type: resistor
      name: Rdcr0
      from: sw0
      to: l0
      R: 0.01

    - type: inductor
      name: L0
      from: l0
      to: out
      L: 150.0e-6

    # ---- Phase 1 ----
    - type: switch          # was vcswitch S1 (ron=0.005, roff=1e6)
      name: S1
      from: vin
      to: sw1
      g_on: 200.0
      g_off: 1.0e-6

    - type: diode
      name: D1
      anode: gnd
      cathode: sw1
      g_on: 1.0e3
      g_off: 1.0e-9
      V_th: 0.7

    - type: resistor
      name: Rsnub1
      from: sw1
      to: gnd
      R: 1.0e6

    - type: resistor
      name: Rdcr1
      from: sw1
      to: l1
      R: 0.01

    - type: inductor
      name: L1
      from: l1
      to: out
      L: 150.0e-6

    # ---- Shared output ----
    - type: capacitor
      name: Cout
      from: out
      to: gnd
      C: 100.0e-6

    - type: resistor
      name: Rload
      from: out
      to: gnd
      R: 10.0

  simulation:
    t_end: 0.01
    dt: 1.25e-7
