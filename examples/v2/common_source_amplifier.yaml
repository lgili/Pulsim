# Pulsim v2 example: common-source MOSFET amplifier
# ---
# Classic CS amp with V13 SH1 MOSFET:
#
#   V_DD = 10 V (constant)
#   R_D  = 5 kΩ from vdd to drain
#   M1   = MosfetLevel1 (K=1e-3 A/V², V_T=2 V, λ=0.02)
#         drain=drain, source=gnd, gate=gate
#   V_in = 3 V DC + 0.1 V·sin(2π·1 kHz·t) → gate
#
# Operating point (V_in DC = 3 V → V_OV = 1 V):
#   I_D  = K·V_OV²·(1+λ·V_DS) → self-consistently with KVL
#   V_DS = V_DD − I_D·R_D
#   Solving: V_drain ≈ 4.55 V, I_D ≈ 1.09 mA
#
# Small-signal gain at this bias:
#   g_m   = ∂I/∂V_GS = 2·K·V_OV = 2·1e-3·1 = 2 mA/V
#   Av    = −g_m·R_D = −2e-3·5000 = −10 V/V
#
# So a 0.1 V gate swing → ~1 V drain swing (inverted phase).
# At V_in = 3.1 V → V_drain ≈ 3.55 V; at V_in = 2.9 V →
# V_drain ≈ 5.55 V. Peak-to-peak v_drain ≈ 2 V.

circuit:
  devices:
    - type: voltage_source
      name: VDD
      from: vdd
      to: gnd
      V: 10.0

    - type: resistor
      name: R_D
      from: vdd
      to: drain
      R: 5000.0

    - type: sine_voltage_source
      name: V_in
      from: gate
      to: gnd
      v_dc: 3.0
      v_amplitude: 0.1
      frequency: 1000.0
      phase: 0.0

    - type: mosfet_level1
      name: M1
      drain: drain
      source: gnd
      gate: gate
      K: 1.0e-3
      V_T: 2.0
      lambda: 0.02
      kappa: 20.0

simulation:
  t_start: 0.0
  t_end:   3.0e-3       # 3 cycles @ 1 kHz
  dt:      5.0e-6       # 5 µs → 200 samples per AC cycle
