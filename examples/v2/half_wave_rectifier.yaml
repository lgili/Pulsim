# Pulsim v2 example: half-wave rectifier
# ---
# V_sine(60 Hz, 10 V amplitude) → diode → R_load → GND.
# Uses the V11 first-class SineVoltageSource (no b_extra_fn
# overlay needed at runtime).

circuit:
  devices:
    - type: sine_voltage_source
      name: Vin
      from: n0
      to: gnd
      v_dc: 0.0
      v_amplitude: 10.0
      frequency: 60.0
      phase: 0.0

    - type: diode
      name: D1
      anode: n0
      cathode: n1
      g_on: 1.0e3
      g_off: 1.0e-9
      V_th: 0.0

    - type: resistor
      name: R_L
      from: n1
      to: gnd
      R: 10.0          # ohms

simulation:
  t_start: 0.0
  t_end: 0.0333        # 2 cycles at 60 Hz
  dt: 1.0e-4
