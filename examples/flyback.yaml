# Pulsim v2 example: isolated flyback converter
# ---
# 48 V → flyback (2:1 turns: L_p/L_s = 4) → ~20 V at 5 Ω load,
# 100 kHz / 50 % duty. Ideal CCM (k = 1) would give 24 V; the
# leakage of k = 0.95 (~10 µH on the primary) is dumped into the RCD
# clamp (~17 W), leaving 19.8 V (energy balance closes to 0.1 %).
#
# Topology:
#   Vin → primary (T1: L_p=100µH, L_s=25µH, k=0.95)
#   primary's "sw" end → Q1 (low-side MOSFET) → gnd
#   secondary's "sec_anode" → D1 → vout
#   vout || Cout || R_L → secondary's ground reference
#
# The user supplies switch_fn(t) for Q1 (typical: 100 kHz
# PWM with 50% duty cycle).

circuit:
  devices:
    - type: voltage_source
      name: Vin
      from: vin
      to: gnd
      V: 48.0

    - type: mosfet
      name: Q1
      drain: sw
      source: gnd
      R_on: 1.0e-2
      R_off: 1.0e9

    # Dot convention: a FLYBACK stores energy while Q1 is on and
    # releases it through D1 while Q1 is off, so the secondary must
    # be wound so that the ON-time voltage REVERSE-biases D1. With
    # s_from = sec_anode the secondary conducted during the whole ON
    # interval as well (measured: |i_s| > 0.5 A on 100 % of ON
    # samples) — a forward converter's polarity, and the "24 V CCM
    # flyback" the header promised was never what this file built.
    # The secondary is therefore wound sec_neg → sec_anode.
    - type: transformer
      name: T1
      p_from: vin
      p_to: sw
      s_from: sec_neg
      s_to: sec_anode
      L_p: 100.0e-6
      L_s: 25.0e-6
      k: 0.95

    - type: diode
      name: D1
      anode: sec_anode
      cathode: vout
      g_on: 1.0e3
      g_off: 1.0e-9
      V_th: 0.7

    - type: capacitor
      name: Cout
      from: vout
      to: sec_neg
      C: 100.0e-6

    - type: resistor
      name: R_L
      from: vout
      to: sec_neg
      R: 5.0

    # RCD clamp: without it the leakage current has no path when Q1
    # opens and the idealised switch node reaches ~26 kV.
    - type: diode
      name: D_cl
      anode: sw
      cathode: clamp
      g_on: 1.0e3
      g_off: 1.0e-9

    - type: capacitor
      name: C_cl
      from: clamp
      to: vin
      C: 1.0e-6

    - type: resistor
      name: R_cl
      from: clamp
      to: vin
      R: 2.0e3

    # Tie secondary reference to primary ground via small
    # ohmic link (optical-isolation in a real circuit; for
    # the simulator this just provides a return path).
    - type: resistor
      name: Rgnd
      from: sec_neg
      to: gnd
      R: 1.0e-6

simulation:
  t_start: 0.0
  t_end: 5.0e-3    # output settles in ~3 ms (R_L·Cout = 0.5 ms)
  dt: 1.0e-8
