circuit:
  devices:
  - type: pulse_voltage_source
    name: Vpulse
    from: in
    to: gnd
    v_initial: 0.0
    v_pulsed: 5.0
    t_start: 0.0
    pulse_width: 0.0005
    period: 0.001
  - type: resistor
    name: R1
    from: in
    to: out
    R: 1000.0
  - type: capacitor
    name: C1
    from: out
    to: gnd
    C: 1.0000000000000001e-07
  simulation:
    t_end: 0.005
    dt: 1.0e-06
