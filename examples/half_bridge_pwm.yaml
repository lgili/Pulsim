# Pulsim v2 example: half-bridge driving an RL load.
#
# Migrated from the legacy `schema: pulsim-v1` format. The old file
# drove two ideal `vcswitch`es from complementary `pwm` voltage
# sources on `ctrl_hi` / `ctrl_lo` nodes (with dead-time). v2 has no
# voltage-controlled switch — the `switch` device is gate-mask driven
# — so S_hi / S_lo are toggled by a `switch_fn(t)` at runtime.
# Use `p.make_dead_time_pwm_pair_fn(...)` to reproduce the 20 kHz,
# 50% duty, complementary pair with 1 µs dead-time:
#
#   import pulsim as p
#   lc = p.load_yaml_file("examples/half_bridge_pwm.yaml")
#   b = lc.builder
#   sw = p.make_dead_time_pwm_pair_fn(frequency=20e3, duty=0.5,
#                                     hs_switch_idx=b.switch_index_of("S_hi"),
#                                     ls_switch_idx=b.switch_index_of("S_lo"),
#                                     num_switches=b.graph.num_switches,
#                                     dead_time=1e-6)
#   res = p.simulate(lc, switch_fn=sw)   # t_end / dt from simulation:

circuit:
  devices:
    - type: voltage_source
      name: Vdc
      from: vcc
      to: gnd
      V: 100.0

    # Split DC bus: the RL load returns to mid = Vdc/2. A resistive
    # divider alone (100 kΩ, as this file had until 2026-11) is no
    # return for a 10 Ω load: mid followed `out` and i_L peaked at
    # 1.2 mA instead of 0.62 A. The 100 kΩ pair only balances the caps.
    - type: capacitor
      name: Cbus_hi
      from: vcc
      to: mid
      C: 100.0e-6

    - type: capacitor
      name: Cbus_lo
      from: mid
      to: gnd
      C: 100.0e-6

    - type: resistor
      name: Rmid1
      from: vcc
      to: mid
      R: 100.0e3

    - type: resistor
      name: Rmid2
      from: mid
      to: gnd
      R: 100.0e3

    - type: switch          # was vcswitch S_hi (ron=0.05, roff=1e9)
      name: S_hi
      from: vcc
      to: out
      g_on: 20.0
      g_off: 1.0e-9

    - type: switch          # was vcswitch S_lo (ron=0.05, roff=1e9)
      name: S_lo
      from: out
      to: gnd
      g_on: 20.0
      g_off: 1.0e-9

    # Anti-parallel diodes carry the inductor current in the dead time
    # (without them it has only the 1 nS off-state of the switches).
    - type: diode
      name: D_hi
      anode: out
      cathode: vcc
      g_on: 1.0e3
      g_off: 1.0e-9

    - type: diode
      name: D_lo
      anode: gnd
      cathode: out
      g_on: 1.0e3
      g_off: 1.0e-9

    - type: resistor
      name: Rload
      from: out
      to: load_mid
      R: 10.0

    - type: inductor
      name: Lload
      from: load_mid
      to: mid
      L: 1.0e-3

simulation:
  t_end: 500.0e-6
  dt: 0.25e-6
