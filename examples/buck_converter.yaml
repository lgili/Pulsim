# Pulsim v2 example: 48 V → buck → ~25.9 V (open-loop, 50% duty).
# 100 µH is below L_crit = (1−D)·R/(2·f) = 125 µH at 20 kHz / 10 Ω, so
# the buck runs in DCM: M = 2/(1+√(1+4K/D²)), K = 2L/(R·T) = 0.4 →
# 25.8 V, not D·V_in = 24 V (measured 25.9 V, settled at 20 ms; the
# 2 ms run below is still settling).
#
# Migrated from the legacy `schema: pulsim-v1` format. The old file
# drove an ideal `vcswitch` from a `pulse` voltage source on a `ctrl`
# node. v2 has no voltage-controlled switch — the `switch` device is
# gate-mask driven — so the high-side switch S1 is toggled by a
# `switch_fn(t)` supplied at runtime (e.g. a 20 kHz / 50% PWM via
# `p.make_pwm_switch_fn`). Run with:
#
#   import pulsim as p
#   lc = p.load_yaml_file("examples/buck_converter.yaml")
#   sw = p.make_pwm_switch_fn(frequency=20e3, duty=0.5,
#                             switch_idx=lc.builder.switch_index_of("S1"),
#                             num_switches=lc.builder.graph.num_switches)
#   res = p.simulate(lc, switch_fn=sw)   # t_end / dt from simulation:

circuit:
  devices:
    - type: voltage_source
      name: Vdc
      from: vcc
      to: gnd
      V: 48.0

    - type: switch          # was vcswitch S1 (ron=0.01, roff=1e9)
      name: S1
      from: vcc
      to: sw_node
      g_on: 100.0
      g_off: 1.0e-9

    - type: diode           # freewheel
      name: D1
      anode: gnd
      cathode: sw_node
      g_on: 1.0e3
      g_off: 1.0e-9
      V_th: 0.7

    - type: inductor
      name: L1
      from: sw_node
      to: out
      L: 100.0e-6

    - type: capacitor
      name: C1
      from: out
      to: gnd
      C: 100.0e-6

    - type: resistor
      name: Rload
      from: out
      to: gnd
      R: 10.0

simulation:
  t_end: 2.0e-3
  dt: 0.5e-6
