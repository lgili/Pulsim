# Pulsim v2 example: 48 V → buck → ~24 V (open-loop, 50% duty).
#
# Migrated from the legacy `schema: pulsim-v1` format. The old file
# drove an ideal `vcswitch` from a `pulse` voltage source on a `ctrl`
# node. v2 has no voltage-controlled switch — the `switch` device is
# gate-mask driven — so the high-side switch S1 is toggled by a
# `switch_fn(t)` supplied at runtime (e.g. a 20 kHz / 50% PWM via
# `p.make_pwm_switch_fn`). Run with:
#
#   import pulsim as p
#   lc = p.load_yaml_file("examples/buck_converter.yaml")
#   sw = p.make_pwm_switch_fn(frequency=20e3, duty=0.5,
#                             num_switches=lc.graph.num_switches,
#                             switch_idx=0)
#   res = p.simulate(lc, t_end=2e-3, dt=0.5e-6, switch_fn=sw)

circuit:
  devices:
    - type: voltage_source
      name: Vdc
      from: vcc
      to: gnd
      V: 48.0

    - type: switch          # was vcswitch S1 (ron=0.01, roff=1e9)
      name: S1
      from: vcc
      to: sw_node
      g_on: 100.0
      g_off: 1.0e-9

    - type: diode           # freewheel
      name: D1
      anode: gnd
      cathode: sw_node
      g_on: 1.0e3
      g_off: 1.0e-9
      V_th: 0.7

    - type: inductor
      name: L1
      from: sw_node
      to: out
      L: 100.0e-6

    - type: capacitor
      name: C1
      from: out
      to: gnd
      C: 100.0e-6

    - type: resistor
      name: Rload
      from: out
      to: gnd
      R: 10.0

  simulation:
    t_end: 2.0e-3
    dt: 0.5e-6
