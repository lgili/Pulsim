      - '2 — MNA Foundations': how-pulsim-works/02-mna-foundations.md
      - '3 — Trapezoidal Companion Discretisation': how-pulsim-works/03-trapezoidal-companion.md
      - '4 — PWL State-Space Cache': how-pulsim-works/04-pwl-state-space-cache.md
      - '5 — Sparse Direct LU Foundations': how-pulsim-works/05-sparse-lu-foundations.md
      - '6 — PulsimSparseLuSolver': how-pulsim-works/06-pulsim-sparse-lu.md
      - '7 — Path-Based Partial Refactorisation': how-pulsim-works/07-rank1-partial-refactor.md
      - '8 — Benchmarks': how-pulsim-works/08-benchmarks.md
