      - 'Tutorial 01 — RC Charging': tutorials/01-rc-charging.md
      - 'Tutorial 02 — Buck Converter': tutorials/02-buck-converter.md
      - 'Tutorial 03 — Isolated Flyback': tutorials/03-flyback-isolated.md
      - 'Tutorial 04 — Three-Phase VSI': tutorials/04-3phase-vsi.md
      - 'Tutorial 05 — LDO with Op-Amp': tutorials/05-ldo-feedback.md
      - 'Tutorial 06 — IGBT Boost': tutorials/06-igbt-boost.md
      - 'Motors — Induction (Phase 2)': motors-induction.md
      - 'Motors — Sensorless Observers (Phase 2)': motors-sensorless.md
      - 'Modular Multilevel Converters (MMC)': mmc.md
      - 'Numerical Solvers (Phase 2)': solvers.md
