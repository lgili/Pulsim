site_name: Pulsim
site_description: Power-electronics circuit simulator — C++23 kernel with a Python-first API
site_url: https://lgili.github.io/Pulsim/
repo_url: https://github.com/lgili/Pulsim
repo_name: lgili/Pulsim
edit_uri: edit/main/docs/

exclude_docs: |
  Doxyfile
  __pycache__/
  python/
  mainpage.md

theme:
  name: material
  language: en
  logo: assets/images/pulsim-logo.svg
  favicon: assets/images/pulsim-logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search
  - mike:
      version_selector: true
      canonical_version: latest
      alias_type: redirect
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            inherited_members: false
            filters:
              - "!^_"
            find_stubs_package: true
            allow_inspection: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lgili/Pulsim
  generator: false

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - User Guide:
      - Overview: v2/index.md
      - Getting Started: v2/getting-started.md
      - Mental Model: v2/mental-model.md
      - 'Tutorial 01 — RC Charging': v2/tutorials/01-rc-charging.md
      - 'Tutorial 02 — Buck Converter': v2/tutorials/02-buck-converter.md
      - 'Tutorial 03 — Isolated Flyback': v2/tutorials/03-flyback-isolated.md
      - 'Tutorial 04 — Three-Phase VSI': v2/tutorials/04-3phase-vsi.md
      - 'Tutorial 05 — LDO with Op-Amp': v2/tutorials/05-ldo-feedback.md
      - 'Tutorial 06 — IGBT Boost': v2/tutorials/06-igbt-boost.md
      - API Reference: v2/api-reference.md
      - UX Helpers (discover, plot, monitor): v2/helpers.md
      - Gotchas: v2/gotchas.md
  - Internals:
      - Architecture (Layer-by-Layer): pulsim-v2/README.md
      - 'Layer 0 — Numeric + Sparse': pulsim-v2/layer0-numeric-and-sparse.md
      - 'Layer 1 — Topology + Enumeration': pulsim-v2/layer1-topology-and-enumeration.md
      - 'Layer 2 — AD + Device Models': pulsim-v2/layer2-ad-and-device-models.md
      - 'Layer 2 V1 — MOSFET / IGBT': pulsim-v2/layer2-v1-mosfet-igbt.md
      - 'Layer 2 V2 — Transformer': pulsim-v2/layer2-v2-transformer.md
      - 'Layer 3 — Stamping Pipeline': pulsim-v2/layer3-stamping-pipeline.md
      - 'Layer 4 — PWL State-Space Cache': pulsim-v2/layer4-pwl-state-space-cache.md
      - 'Layer 4 V1 — Trapezoidal Companion': pulsim-v2/layer4-v1-trapezoidal-companion.md
      - 'Layer 10 — Benchmarks': pulsim-v2/layer10-benchmarks.md
  - Operations:
      - Build System: build-system.md
      - Performance Tuning: performance-tuning.md
      - Troubleshooting: troubleshooting.md
      - Migration Guide (v1 → v2): migration-guide.md
      - Docs Versioning and Release: versioning-and-release.md
