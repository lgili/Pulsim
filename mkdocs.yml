site_name: Pulsim
site_description: Power-electronics circuit simulator — C++23 kernel with a Python-first API
site_url: https://lgili.github.io/Pulsim/
repo_url: https://github.com/lgili/Pulsim
repo_name: lgili/Pulsim
edit_uri: edit/main/docs/

exclude_docs: |
  Doxyfile
  __pycache__/
  python/
  mainpage.md

theme:
  name: material
  language: en
  logo: assets/images/pulsim-logo.svg
  favicon: assets/images/pulsim-logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: deep orange
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: deep orange
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.tracking
    - content.action.edit
    - content.action.view
    - content.code.copy
    - content.code.annotate
    - toc.follow

plugins:
  - search
  - mike:
      version_selector: true
      canonical_version: latest
      alias_type: redirect
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            inherited_members: false
            filters:
              - "!^_"
            find_stubs_package: true
            allow_inspection: false

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  # Mermaid diagrams via custom_fences + Material's built-in mermaid loader.
  # Used by the "How Pulsim Works" section (etree, path walk, layer stack).
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  # KaTeX-rendered math via arithmatex. Used heavily by the "How Pulsim
  # Works" section for MNA / trapezoidal / sparse-LU equations.
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  # KaTeX (rendered via arithmatex generic mode).
  - assets/js/katex.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js

extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lgili/Pulsim
  generator: false

extra_css:
  - assets/stylesheets/extra.css
  # KaTeX styling for math rendering (used by How Pulsim Works section).
  - https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css

nav:
