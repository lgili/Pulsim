[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pulsim-bench"
version = "0.1.0"
description = "Pulsim developer benchmark CLI — unified runner, parity, stress, local-limit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Pulsim Authors", email = "pulsim@example.com"}
]
keywords = ["pulsim", "benchmark", "dev-tool", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.scripts]
pulsim-bench = "pulsim_bench.cli:app"

[project.urls]
Repository = "https://github.com/pulsim/pulsim-core"

[tool.setuptools.packages.find]
include = ["pulsim_bench*"]

# Note: this package is intentionally independent of the main `pulsim`
# distribution. It calls into the runtime via `import pulsim` only
# inside subcommand handlers — the CLI itself imports cleanly even
# when the simulator extension is not built.
