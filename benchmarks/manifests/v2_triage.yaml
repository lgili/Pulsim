# v2 triage of the 126 `schema: pulsim-v1` benchmark circuits.
# One entry per file under benchmarks/circuits (path relative to benchmarks/).
#   runs     - benchmarks/tools/v1_reader.py maps it and engine='pwl' completes
#   skipped  - the reader refuses it; `reason` is the text of its Unmapped error
#   error    - it maps, but engine='pwl' fails; `match` is in the exception text
# `tol: {engine: x}` overrides the differential runner's default tolerance
# (loosening one needs a `reason`); `known: {engine: outcome}` records a
# disagree/error cell found by the runner so the nightly job flags only changes.
# Outcomes and freezes are on the strict `interp` gate; the edge diagnostic never decides.
# test_benchmark_harness.py keeps every entry honest (a skip that starts
# loading, or an error that starts running, fails the test).
