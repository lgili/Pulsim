        spice_vector: v(node)
    scenarios: [gmres_trbdf2]
  - path: circuits/diode_half_wave_rl_load.yaml
    ngspice_netlist: spice/ngspice/diode_half_wave_rl_load.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [gmres_trbdf2]
  # ----- IC/DC/resonance batch (Phase 9 — third validation batch) -----
  # NOTE: `chopper_inductive_freewheel` was attempted in this batch but
  # exposed a Pulsim numerical limitation: vcswitch + L + diode in OFF
  # commutation produces unbounded ringing (±50 kV peaks across the
  # switch node) that grows with finer dt. Tracked separately as a
  # known solver-side issue; the four entries below stick to paths
  # that the solver handles cleanly.
  - path: circuits/capacitor_natural_discharge.yaml
    ngspice_netlist: spice/ngspice/capacitor_natural_discharge.cir
    ngspice_observables:
      - column: V(node)
        spice_vector: v(node)
    scenarios: [gmres_trbdf2]
  - path: circuits/voltage_divider_3stage.yaml
    ngspice_netlist: spice/ngspice/voltage_divider_3stage.cir
    ngspice_observables:
      - column: V(n_mid)
        spice_vector: v(n_mid)
    scenarios: [direct_trap]
  - path: circuits/bridge_resistive_pure.yaml
    ngspice_netlist: spice/ngspice/bridge_resistive_pure.cir
    ngspice_observables:
      - column: V(a)
        spice_vector: v(a)
    scenarios: [direct_trap]
  - path: circuits/driven_lc_series_resonance.yaml
    ngspice_netlist: spice/ngspice/driven_lc_series_resonance.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [gmres_trbdf2]
  # ----- Stress / bug-hunt batch (Phase 10 — fourth validation batch) -----
  # Designed to STRESS the solver and expose limits, not just validate
  # happy paths. Each entry documents the hypothesis being tested.
  #
  # NOTE: `chopper_with_rc_snubber` was attempted in this batch and
  # CONFIRMED the negative finding from batch 3: vcswitch + L + diode
  # commutation produces EXPONENTIALLY GROWING numerical instability
  # (V(sw) ringing at ±1 kV → ±24 kV over 1.5 ms; Vcc current reaches
  # ±15 MA). Adding an RC snubber across the switch did NOT help. The
  # bug is solver-side, NOT topology-side. See
  # `benchmarks/circuits/NOTES_known_issues.md` for details. YAML+CIR
  # files remain on disk as regression-test fixtures for when the
  # solver gains the fix.
  - path: circuits/high_q_rlc_ringdown.yaml
    ngspice_netlist: spice/ngspice/high_q_rlc_ringdown.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [gmres_trbdf2]
  - path: circuits/stiff_two_timescale_rc.yaml
    ngspice_netlist: spice/ngspice/stiff_two_timescale_rc.cir
    ngspice_observables:
      - column: V(slow)
        spice_vector: v(slow)
    scenarios: [gmres_trbdf2]
  - path: circuits/back_to_back_diodes_sine.yaml
    ngspice_netlist: spice/ngspice/back_to_back_diodes_sine.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [gmres_trbdf2]
  - path: circuits/rlc_parallel_step.yaml
    ngspice_netlist: spice/ngspice/rlc_parallel_step.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [gmres_trbdf2]
  - path: circuits/pulse_voltage_rl.yaml
    ngspice_netlist: spice/ngspice/pulse_voltage_rl.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  # transformer_step_up — held off pending follow-up:
  #   Pulsim's `transformer` is an algebraic ideal transformer
  #   (V_p = N·V_s, I_p = -N·I_s, no magnetizing inductance). ngspice
  #   has no native ideal-transformer primitive; the canonical mirror
  #   uses two coupled inductors (`L1 + L2 + K1`), but with high
  #   inductance values + K → 1 ngspice's MNA goes silently to all-
  #   zeros (numerical conditioning issue with K close to 1), and with
  #   K = 0.99 the magnetizing-current loading drops V(pri_x) below
  #   Pulsim's algebraic ideal by ~5 %. This is a model-paradigm
  #   mismatch, not a Pulsim bug. Re-enable when ngspice gets a
  #   stable coupled-inductor mirror or Pulsim adds a "transformer
  #   with finite Lm" primitive that can be matched.
  - path: circuits/transformer_step_up.yaml
    scenarios: [direct_trap]

  # ----- Phase 14 component-coverage additions -----
  # Each new entry validates one Pulsim primitive end-to-end against
  # ngspice. The goal: a runnable matrix that proves every supported
  # component in the parser still produces SPICE-equivalent behavior.
  - path: circuits/sine_voltage_rc.yaml
    ngspice_netlist: spice/ngspice/sine_voltage_rc.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/pwm_voltage_rc.yaml
    ngspice_netlist: spice/ngspice/pwm_voltage_rc.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/snubber_rc.yaml
    ngspice_netlist: spice/ngspice/snubber_rc.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/vcswitch_resistor.yaml
    ngspice_netlist: spice/ngspice/vcswitch_resistor.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/mosfet_nmos_dc.yaml
    ngspice_netlist: spice/ngspice/mosfet_nmos_dc.cir
    ngspice_observables:
      - column: V(drain)
        spice_vector: v(drain)
    scenarios: [direct_trap]
  - path: circuits/coupled_inductor_step.yaml
    ngspice_netlist: spice/ngspice/coupled_inductor_step.cir
    ngspice_observables:
      - column: V(sec)
        spice_vector: v(sec)
    scenarios: [direct_trap]
  - path: circuits/transformer_leakage.yaml
    ngspice_netlist: spice/ngspice/transformer_leakage.cir
    ngspice_observables:
      - column: V(sec)
        spice_vector: v(sec)
    scenarios: [direct_trap]

  # ----- Phase 17: inverter / topology stress tests -----
  # Progressively heavier topologies designed to find solver +
  # component-coverage gaps. Each pushes a different stress axis.
  - path: circuits/synchronous_buck.yaml
    ngspice_netlist: spice/ngspice/synchronous_buck.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/half_bridge_inverter.yaml
    ngspice_netlist: spice/ngspice/half_bridge_inverter.cir
    ngspice_observables:
      - column: V(load)
        spice_vector: v(load)
    scenarios: [direct_trap]
  # full_bridge_dc UN-DEFERRED in Phase 22 after the diode-
  # commutation heuristic (force_inductor_driven_diode_commutations,
  # commit 39e4568) — the body diodes now commute simultaneously
  # with the diagonal-pair flip, V(load_p)/V(load_n) settle cleanly
  # at ±V_dc, and IL stays bounded. No ngspice mirror; baselined
  # against Pulsim itself like the other Phase 19+ regression
  # benches.
  - path: circuits/full_bridge_dc.yaml
    scenarios: [default]
  # flyback_converter: coupled_inductor + vcswitch + diode cascade
  # on a transformer-isolated SMPS. With the original
  # `trapezoidal + adaptive_timestep + switching_mode:ideal`
  # config the mutual-coupling stamp interacted with the switch
  # PWL state badly enough that Newton couldn't make it past the
  # first PWM transition. Switched to the buck_switching robust
  # template (bdf1 + dt=0.1 µs + Newton max_iter=240 + gmin
  # stepping) and the same circuit now passes with max_err ≈
  # 0.38 V on V(out). No C++ change was needed — the mutual
  # stamp + diode commutation simply needs the same
  # rejection-tolerant config the other switching benches use.
  - path: circuits/flyback_converter.yaml
    ngspice_netlist: spice/ngspice/flyback_converter.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    # flyback needs the bdf1+robust-Newton config from the YAML;
    # direct_trap forces trapezoidal which breaks at the first PWM
    # transition. The trbdf2 scenario keeps the YAML's bdf1 (or
    # falls back to TRBDF2) and the manifest run passes.
    scenarios: [trbdf2]
  - path: circuits/boost_classic.yaml
    ngspice_netlist: spice/ngspice/boost_classic.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/buck_boost.yaml
    ngspice_netlist: spice/ngspice/buck_boost.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]

  # cascaded_boost_buck UN-DEFERRED in Phase 22 — same fix
  # (force_inductor_driven_diode_commutations) unblocks the boost
  # stage. IL builds correctly now and V(bus) climbs to its
  # operating point. The exact steady-state isn't perfect because
  # the open-loop fixed-duty boost is intrinsically slow to settle,
  # but the simulation is stable and deterministic — a regression
  # tracker on what Pulsim does today.
  - path: circuits/cascaded_boost_buck.yaml
    scenarios: [default]
  - path: circuits/cascaded_buck_buck.yaml
    ngspice_netlist: spice/ngspice/cascaded_buck_buck.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/sync_buck_500khz.yaml
    ngspice_netlist: spice/ngspice/sync_buck_500khz.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/triple_sync_buck.yaml
    ngspice_netlist: spice/ngspice/triple_sync_buck.cir
    ngspice_observables:
      - column: V(out_b)
        spice_vector: v(out_b)
    scenarios: [direct_trap]
  - path: circuits/buck_dcm.yaml
    ngspice_netlist: spice/ngspice/buck_dcm.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]

  # ----- Phase 18: heavier topology stress tests -----
  # 10 new converter / inverter topologies covering most of the
  # PE textbook taxonomy.  3 deferred (sync_boost, half_bridge_
  # transformer_dc, npc_three_level_halfbridge) — see DEFERRED
  # comments below.
  - path: circuits/diode_bridge_rectifier.yaml
    ngspice_netlist: spice/ngspice/diode_bridge_rectifier.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/sepic.yaml
    ngspice_netlist: spice/ngspice/sepic.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/cuk_converter.yaml
    ngspice_netlist: spice/ngspice/cuk_converter.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/voltage_doubler.yaml
    ngspice_netlist: spice/ngspice/voltage_doubler.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/two_phase_interleaved_boost.yaml
    ngspice_netlist: spice/ngspice/two_phase_interleaved_boost.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/synchronous_flyback.yaml
    ngspice_netlist: spice/ngspice/synchronous_flyback.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [trbdf2]
  - path: circuits/bidirectional_buck_boost.yaml
    ngspice_netlist: spice/ngspice/bidirectional_buck_boost.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/three_phase_diode_rectifier.yaml
    ngspice_netlist: spice/ngspice/three_phase_diode_rectifier.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    # YAML uses bdf1 + robust Newton config; need direct_bdf1
    # scenario so the manifest doesn't override to trapezoidal/
    # trbdf2 (both of which lose accuracy on this circuit).
    scenarios: [direct_bdf1]
  - path: circuits/forward_converter.yaml
    ngspice_netlist: spice/ngspice/forward_converter.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [trbdf2]
  - path: circuits/buck_with_current_sense.yaml
    ngspice_netlist: spice/ngspice/buck_with_current_sense.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]

  # ----- Phase 19: closed-loop / control-block coverage -----
  # Each circuit exercises one or more virtual control blocks
  # wired into a small power stage. ngspice has no equivalent
  # for these blocks, so they validate against captured Pulsim
  # baselines (regression-only — output verified-by-hand once).
  - path: circuits/cl_buck_pi.yaml
    scenarios: [default]
  - path: circuits/cl_buck_pid.yaml
    scenarios: [default]
  - path: circuits/cl_buck_hysteresis.yaml
    scenarios: [default]
  - path: circuits/cl_buck_lookup_duty.yaml
    scenarios: [default]
  - path: circuits/cl_buck_rate_limited_ref.yaml
    scenarios: [default]
  - path: circuits/cl_buck_aggressive_pi.yaml
    scenarios: [default]
  - path: circuits/cl_buck_sample_hold.yaml
    scenarios: [default]
  - path: circuits/cl_buck_pi_with_gain.yaml
    scenarios: [default]
  - path: circuits/cl_buck_integrator.yaml
    scenarios: [default]
  - path: circuits/cl_buck_limiter_chain.yaml
    scenarios: [default]
  # cl_boost_pi un-deferred in Phase 21 after the diode-commutation
  # heuristic landed (force_inductor_driven_diode_commutations).  The
  # V(sw) ±10 kV chatter that previously killed this bench is gone;
  # the boost now runs deterministically and the regression dashboard
  # tracks it.  Steady-state regulation is still mediocre (~1 V on a
  # 10 V target) because the open-loop boost is intrinsically slow to
  # come up with these gains — the test verifies stability, not the
  # exact operating point.
  - path: circuits/cl_boost_pi.yaml
    scenarios: [default]

  # ----- Phase 22: un-deferred (previously documented as failures) -----
  # All five lived in the "deferred / known issue" zone for several
  # phases. The diode-commutation heuristic (Phase 21) + `enable_events:
  # true` and a couple of YAML refresh-ups got them all running
  # deterministically. They validate against captured Pulsim baselines
  # like the other regression-only benches.
  - path: circuits/synchronous_boost.yaml
    scenarios: [default]
  - path: circuits/half_bridge_transformer_dc.yaml
    scenarios: [default]
  - path: circuits/npc_three_level_halfbridge.yaml
    scenarios: [default]

  # ----- Phase 23 Sprint B: Bode / frequency-domain validation -----
  - path: circuits/bode_rlc_low_pass.yaml
    scenarios: [default]

  # ----- Phase 23 Sprint C #1: motor drive benchmarks -----
  # DC brush + PMSM (dq frame) + three-phase induction (locked rotor).
  # All built from existing primitives; each validates against an
  # analytical steady-state.
  - path: circuits/motor_dc_brush_step_load.yaml
    scenarios: [default]
  - path: circuits/motor_pmsm_dq_open_loop.yaml
    scenarios: [default]
  - path: circuits/motor_induction_locked_rotor.yaml
    scenarios: [default]

  # ----- Phase 23 Sprint C #2: three-phase + PLL -----
  - path: circuits/three_phase_balanced_rl_load.yaml
    scenarios: [default]
  - path: circuits/grid_pll_lock.yaml
    scenarios: [default]

  # ----- Phase 23 Bonus: textbook reference cases -----
  - path: circuits/textbook_erickson_buck_ccm.yaml
    scenarios: [default]
  - path: circuits/textbook_erickson_boost_ccm.yaml
    scenarios: [default]

  # ----- Phase 24: soft-switching detection (ZVS / ZCS) -----
  - path: circuits/buck_hard_switching_reference.yaml
    scenarios: [default]

  # ----- Phase 25: long-simulation / numerical-stress benches -----
  - path: circuits/long_run_drift_buck.yaml
    scenarios: [default]
  - path: circuits/high_freq_gan_buck.yaml
    scenarios: [default]
  - path: circuits/stiff_rc_high_freq_switching.yaml
    scenarios: [default]
  - path: circuits/mmc_4cell_chain.yaml
    scenarios: [default]

  # ----- Phase 26: magnetic saturation + core loss (Steinmetz) -----
  - path: circuits/saturating_inductor_step.yaml
    scenarios: [default]
  - path: circuits/core_loss_steinmetz_sine.yaml
    scenarios: [default]

  # ----- Phase 27: electrothermal coupling (Python-side estimator) -----
  - path: circuits/electrothermal_resistor_self_heating.yaml
    scenarios: [default]

  # ----- Phase 20: sine input/output + multilevel converters -----
  # No ngspice equivalents wired up here either — these validate
  # against captured Pulsim baselines, like the Phase 19 closed-
  # loop benches.  Each one exercises a different mix of:
  # sine-source AC behavior, multi-cell switching topologies,
  # transformer-isolated paths, and high-Q resonant tanks.
  - path: circuits/rlc_series_resonant.yaml
    scenarios: [default]
  - path: circuits/lc_low_pass_sine.yaml
    scenarios: [default]
  - path: circuits/half_wave_rectifier_sine.yaml
    scenarios: [default]
  - path: circuits/half_bridge_lc_filter.yaml
    scenarios: [default]
  - path: circuits/flying_capacitor_3level.yaml
    scenarios: [default]
  - path: circuits/cascaded_h_bridge_5level.yaml
    scenarios: [default]
  - path: circuits/t_type_3level_halfbridge.yaml
    scenarios: [default]
  - path: circuits/lcc_resonant_inverter.yaml
    scenarios: [default]
  - path: circuits/active_clamp_forward.yaml
    scenarios: [default]
  - path: circuits/boost_pfc_open_loop.yaml
    scenarios: [default]
  - path: circuits/dual_active_bridge.yaml
    scenarios: [default]
  - path: circuits/half_bridge_inverter_lc.yaml
    scenarios: [default]

  # Phase 22: all three formerly-deferred topologies above are now
  # un-deferred. Sync_boost runs with enable_events:true so vcswitch
  # admissibility correctly catches the gate transitions. HBTX uses
  # complementary v_high/v_low + duty-mirror PWMs (no phase param)
  # and 4-node coupled_inductor secondary with a virtual-CT cap.
  # NPC's observable is V(n_lo) (LC-filtered output) rather than the
  # chopped V(out) — the chopped node still oscillates wildly during
  # the dead-time transitions but the filtered output settles around
  # 27 V (target = 36 V for 50 % duty NPC).

  # buck_pmos — Phase 14 re-test: Pulsim's PMOS now DC-OP-converges
  #   and the transient settles to ~12 V at t = 500 µs (with the
  #   MOSFET runtime-stamp sign fix). However, the **ngspice
  #   reference** itself fails to converge on this circuit:
  #     ngspice doAnalyses: TRAN: Timestep too small; trouble with
  #     node "sw"
  #   ngspice aborts after 7 data rows, so there's nothing to compare
  #   against. This is a SPICE-side numerical issue with the Level-1
  #   PMOS model + 64 % duty cycle, not a Pulsim correctness gap.
  #   Kept here as a future "needs ngspice .cir tuning" item.
  - path: circuits/buck_pmos.yaml
    scenarios: [direct_trap, trbdf2]

  # Phase 28: three-phase control primitives — Clarke / Park / PLL / SVM.
  # Each bench just runs the chain on a synthetic grid; channels feed
  # through `<name>.alpha`, `<name>.theta`, etc. and are dumped to
  # the CSV as `chan:<name>` columns. Baselines were captured with the
  # default direct_trap scenario.
  - path: circuits/three_phase_dq_decoupling.yaml
    scenarios: [direct_trap]
  - path: circuits/pll_grid_sync.yaml
    scenarios: [direct_trap]
  - path: circuits/vector_control_open_loop.yaml
    scenarios: [direct_trap]
scenarios:
  direct_trap:
    simulation:
      integrator: trapezoidal
      solver:
        order: [klu]
  gmres_trbdf2:
    simulation:
      integrator: trbdf2
      solver:
        order: [gmres]
        iterative:
          max_iterations: 200
          tolerance: 1e-8
          restart: 40
          preconditioner: ilut
          ilut_drop_tolerance: 1e-3
          ilut_fill_factor: 10
  jfnk_trbdf2:
    simulation:
      integrator: trbdf2
      solver:
        order: [gmres]
        iterative:
          max_iterations: 200
          tolerance: 1e-8
          restart: 40
          preconditioner: ilut
      newton:
        enable_newton_krylov: true
        krylov_residual_cache_tolerance: 1e-8
  trbdf2:
    simulation:
      integrator: trbdf2
      solver:
        order: [klu]
  direct_bdf1:
    simulation:
      integrator: bdf1
      solver:
        order: [klu]
  rosenbrockw:
    simulation:
      integrator: rosenbrockw
      solver:
        order: [klu]
  shooting_default:
    simulation:
      shooting:
        period: 20e-6
        max_iterations: 20
        tolerance: 1e-6
        relaxation: 0.5
        store_last_transient: true
  harmonic_balance:
    simulation:
      harmonic_balance:
        period: 20e-6
        num_samples: 128
        max_iterations: 30
        tolerance: 1e-6
        relaxation: 0.5
        initialize_from_transient: true
simulators:
  ltspice:
    args: [-ascii, -b]
