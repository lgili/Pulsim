    scenarios: [trbdf2, rosenbrockw]
  # periodic_rc_pwm — Pulsim-only periodic-analysis bench. Kept in
  # the benchmark index so the stress catalog (which uses
  # shooting_default / harmonic_balance scenarios) can resolve it,
  # but explicitly carries no SPICE netlist or observables — the
  # parity dashboard ignores entries without a `ngspice_netlist` /
  # `ltspice_netlist` field.
  - path: circuits/periodic_rc_pwm.yaml
    scenarios: [direct_trap, shooting_default, harmonic_balance]

  # ----- Component-coverage benchmarks (Phase 7) -----
  - path: circuits/current_source_rc.yaml
    ngspice_netlist: spice/ngspice/current_source_rc.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/current_source_rl_step.yaml
    ngspice_netlist: spice/ngspice/current_source_rl_step.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    # direct_trap (pure trapezoidal) rings on the DC-current-source +
    # inductor UIC step — known trap weakness on stiff inductive
    # discontinuities. trbdf2 (L-stable) handles it cleanly. ngspice
    # has internal adaptive timestep that damps the equivalent.
    scenarios: [gmres_trbdf2]
  - path: circuits/rl_high_pass_sine.yaml
    ngspice_netlist: spice/ngspice/rl_high_pass_sine.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [gmres_trbdf2]
  - path: circuits/rlc_overdamped_step.yaml
    ngspice_netlist: spice/ngspice/rlc_overdamped_step.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/two_stage_rc_lowpass.yaml
    ngspice_netlist: spice/ngspice/two_stage_rc_lowpass.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [direct_trap]
  - path: circuits/lc_resonant_tank.yaml
    ngspice_netlist: spice/ngspice/lc_resonant_tank.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    # Lossless LC — needs trbdf2 (L-stable). Trap accumulates phase
    # drift over many oscillation cycles.
    scenarios: [gmres_trbdf2]
  - path: circuits/current_divider_3way.yaml
    ngspice_netlist: spice/ngspice/current_divider_3way.cir
    ngspice_observables:
      - column: V(node)
        spice_vector: v(node)
    scenarios: [direct_trap]
  # ----- Model-interaction batch (Phase 8 — second validation batch) -----
  - path: circuits/diode_clamp_overvoltage.yaml
    ngspice_netlist: spice/ngspice/diode_clamp_overvoltage.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    # direct_trap numerically explodes at the 0→15V step crossing the
    # diode's piecewise-linear knee (oscillation grows unbounded).
    # gmres_trbdf2 is L-stable and tracks the clamp cleanly.
    scenarios: [gmres_trbdf2]
  - path: circuits/pwm_voltage_rl_filter.yaml
    ngspice_netlist: spice/ngspice/pwm_voltage_rl_filter.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    scenarios: [gmres_trbdf2]
