# Pulsim benchmark manifest.
#
# Path convention (post structural reorg, see REORG_PLAN.md phases A–E):
#   * `path:` / `ngspice_netlist:` / `ltspice_netlist:` / `baseline:`
#     entries are resolved RELATIVE TO `benchmarks/` (the suite root,
#     i.e. the parent of this `manifests/` directory).
#   * Runners must use `benchmarks/` as the path resolution base, NOT
#     the manifest's own parent directory.
#
# Layout:
#   benchmarks/
#   ├── circuits/    YAML netlists      (path: circuits/<name>.yaml)
#   ├── spice/       SPICE backends     (ngspice_netlist: spice/ngspice/…)
#   │                                   (ltspice_netlist: spice/ltspice/…)
#   ├── baselines/   reference CSVs     (baseline: baselines/<name>.csv)
#   ├── manifests/   <- this file lives here
#   ├── tools/       bench runners (benchmark_runner.py, etc.)
#   └── kpi_baselines/  frozen KPI snapshots

benchmarks:
  - path: circuits/rc_step.yaml
    ngspice_netlist: spice/ngspice/rc_step.cir
    ltspice_netlist: spice/ltspice/rc_step.cir
    ltspice_observables:
      - column: V(out)
        ltspice_vector: V(out)
    scenarios: [direct_trap, gmres_trbdf2, jfnk_trbdf2]
  - path: circuits/rl_step.yaml
