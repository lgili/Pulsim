        ltspice_vector: V(out)
    scenarios: [direct_trap, trbdf2]
  - path: circuits/buck_mosfet_nonlinear.yaml
    ngspice_netlist: spice/ngspice/buck_mosfet_nonlinear.cir
    ngspice_observables:
      - column: V(out)
        spice_vector: v(out)
    ltspice_netlist: spice/ltspice/buck_mosfet_nonlinear.cir
    ltspice_observables:
