schema: pulsim-v1
version: 1
benchmark:
  id: ll16_flyback_closed_loop
  category: local_limit
  validation:
    type: none
simulation:
  tstart: 0.0
  tstop: 2e-3
  dt: 0.25e-6
  uic: true   # a flyback's DC point shorts Lm through the switch
components:
  - type: voltage_source
    name: Vin
    nodes: [vin, 0]
    waveform:
      type: dc
      value: 48.0

  - type: voltage_source
    name: Vref
    nodes: [vref, 0]
    waveform:
      type: dc
      value: 12.0

  # Power Stage - flyback transformer, Np/Ns = 4, Lm_pri = 160u: the
  # magnetizing inductance across an ideal transformer (a coupled
  # inductor with k = 1; Lsec = Lm / 16 = 10u is implied). Before
  # 2026-11-18 the secondary inductor was not coupled to anything and
  # Lm_core sat in parallel with the switch, so V(vout) = 0 and every
  # turn-off interrupted 604 A into roff; the authored 2u leakage had no
  # clamp to take its current at turn-off, so it is folded into Lm.
  - type: inductor
    name: Lm_core
    nodes: [vin, drain]
    value: 160u

  - type: transformer
    name: T1
    nodes: [vin, drain, 0, sec] # dot at sec reversed: a flyback
    turns_ratio: 4.0

  - type: vcswitch
    name: S_main
    nodes: [0, drain, 0]
    v_threshold: 1.0
    ron: 0.05
    roff: 1e7

  - type: diode
    name: D_sec
    nodes: [sec, vout]
    is: 1e-12
    n: 1.2

  - type: capacitor
    name: Cout
    nodes: [vout, 0]
    value: 470u

  - type: resistor
    name: Rload
    nodes: [vout, 0]
    value: 5.0

  # Control Loop
  - type: pi_controller
    name: PI1
    nodes: [vref, vout, 0]
    kp: 0.01
    ki: 20.0
    output_min: 0.02
    output_max: 0.50 # Protect flyback duty ratio
    anti_windup: 1.0

  - type: pwm_generator
    name: PWM1
    nodes: [0]
    duty_from_channel: PI1
    frequency: 150000.0
    duty_min: 0.02
    duty_max: 0.60
    v_high: 5.0
    v_low: 0.0
    target_component: S_main
