schema: pulsim-v1
version: 1
benchmark:
  id: inductor_chain_step
  category: linear
  observables:
    - column: V(out)
  expectations:
    metrics:
      # V_step → R → L1 → L2 → ground. Series inductors combine:
      # L_eq = L1 + L2 = 30 mH. Same as RL step with L_eq.
      # V(out) = V across L2 only = V_step · (L2/L_eq) · exp(-t·R/L_eq).
      # V(0+) = 5 · (20/30) = 3.333 V. τ = L_eq/R = 300 µs.
      max_error: 5e-3
  validation:
    type: analytical
    model: rl_step
    observable: V(out)
    ignore_initial_samples: 1
    params:
      v0: 3.333333          # V(0+) = V_in · L2/(L1+L2) = 5 · 2/3
      r: 100.0
      l: 30e-3              # L_eq for τ
# Series chain of 2 inductors driven by a pulse source through R.
# Tests multiple inductor state variables (i_L1 = i_L2 in series)
# and the analytical step shape applied to L2's voltage share.
simulation:
  tstop: 2e-3
  dt: 5e-6
  integrator: trbdf2
  uic: true
components:
  - type: voltage_source
    name: Vp
    nodes: [in, 0]
    waveform:
      type: pulse
      v_initial: 0.0
      v_pulse: 5.0
      t_delay: 0.0
      t_rise: 1e-9
      t_fall: 1e-9
      t_width: 10e-3
      period: 20e-3
  - type: resistor
    name: R1
    nodes: [in, n1]
    value: 100.0
  - type: inductor
    name: L1
    nodes: [n1, out]
    value: 10e-3
    ic: 0.0
  - type: inductor
    name: L2
    nodes: [out, 0]
    value: 20e-3
    ic: 0.0
