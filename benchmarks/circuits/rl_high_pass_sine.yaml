schema: pulsim-v1
version: 1
benchmark:
  id: rl_high_pass_sine
  category: linear
  observables:
    - column: V(out)
  expectations:
    metrics:
      # RL high-pass: V_out / V_in = jωL / (R + jωL).
      # f_c = R / (2π·L) = 100 / (2π·10e-3) = 1592 Hz.
      # Source at 5 kHz (well above f_c) → near-unity gain, small phase lag.
      # Sample-grid phase between Pulsim fixed-step trbdf2 and ngspice
      # adaptive trap accumulates to ~12 mV on a 5 V swing (0.25%) at
      # extrema. Threshold sized for that.
      max_error: 5e-2
  validation:
    type: reference
    observable: V(out)
    baseline: baselines/rl_high_pass_sine.csv
# Sine source → R (series) → L (output to ground). V(out) = drop across L.
# High-pass: blocks DC, passes high frequencies.
simulation:
  tstop: 2e-3
  dt: 5e-6
  integrator: trbdf2
  uic: true
components:
  - type: voltage_source
    name: Vac
    nodes: [in, 0]
    waveform:
      type: sine
      amplitude: 5.0
      frequency: 5000.0
      offset: 0.0
      phase: 0.0
  - type: resistor
    name: R1
    nodes: [in, out]
    value: 100.0
  - type: inductor
    name: L1
    nodes: [out, 0]
    value: 10e-3
    ic: 0.0
