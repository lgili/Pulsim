schema: pulsim-v1
version: 1
benchmark:
  id: two_stage_rc_lowpass
  category: linear
  observables:
    - column: V(out)
  expectations:
    metrics:
      # 2-stage cascaded RC low-pass: response is NOT a single exponential.
      # Each stage τ = RC = 100 µs; the cascade has a 2nd-order behavior
      # closer to (1 - (1+t/τ)·exp(-t/τ)). First few samples during the
      # rising edge diverge by ~34 mV on a 5 V swing (0.7%) between
      # Pulsim fixed-step and ngspice adaptive trap. Settles to numerical
      # noise (<1 mV) in steady-state.
      max_error: 5e-2
  validation:
    type: reference
    observable: V(out)
    baseline: baselines/two_stage_rc_lowpass.csv
# Two cascaded RC low-pass filters. Tests multi-node MNA assembly
# (4 nodes total) and intermediate state propagation. Useful as
# a sanity check that the linear solver handles small but non-trivial
# matrices correctly.
simulation:
  tstop: 5e-3
  dt: 5e-6
  uic: true
components:
  - type: voltage_source
    name: Vp
    nodes: [in, 0]
    waveform:
      type: pulse
      v_initial: 0.0
      v_pulse: 5.0
      t_delay: 0.0
      t_rise: 1e-9
      t_fall: 1e-9
      t_width: 10e-3
      period: 20e-3
  - type: resistor
    name: R1
    nodes: [in, mid]
    value: 1000.0
  - type: capacitor
    name: C1
    nodes: [mid, 0]
    value: 100e-9
    ic: 0.0
  - type: resistor
    name: R2
    nodes: [mid, out]
    value: 1000.0
  - type: capacitor
    name: C2
    nodes: [out, 0]
    value: 100e-9
    ic: 0.0
