schema: pulsim-v1
version: 1
benchmark:
  id: high_q_rlc_ringdown
  category: linear
  observables:
    - column: V(out)
  expectations:
    metrics:
      # Series RLC with VERY high Q (intentionally a stress test).
      #   R = 0.1 Ω, L = 1 mH, C = 1 µF → Q = (1/R)·sqrt(L/C) = 316.
      #   ω_0 = 31.6 krad/s, f_0 = 5033 Hz, T_0 = 199 µs.
      #   Damping envelope = exp(-R/2L · t) = exp(-50 t):
      #     at t = 10 ms, envelope ≈ exp(-0.5) ≈ 0.6
      #     → ~50 oscillation cycles within the test window, each
      #       only ~3% damped. Solver damping mismatch accumulates here.
      # STRESS TEST: if Pulsim's trbdf2 adds extra numerical damping
      # the ringdown will decay faster than ngspice. Threshold sized
      # to catch a 5% mismatch on the 10 V step envelope.
      max_error: 1.0
  validation:
    type: reference
    observable: V(out)
    baseline: baselines/high_q_rlc_ringdown.csv
# Underdamped series RLC step response at Q = 316. Tests how each
# integrator handles long, lightly-damped oscillations — a known
# weakness for both trap (no damping → drifts in phase) and trbdf2
# (adds damping → decay faster than physical). PSIM and PLECS both
# use trap or trbdf2 here; the parity test exposes which family
# Pulsim resembles more closely.
simulation:
  tstop: 10e-3
  dt: 2e-6
  integrator: trbdf2
  uic: true
components:
  - type: voltage_source
    name: Vp
    nodes: [in, 0]
    waveform:
      type: pulse
      v_initial: 0.0
      v_pulse: 10.0
      t_delay: 0.0
      t_rise: 1e-9
      t_fall: 1e-9
      t_width: 20e-3
      period: 40e-3
  - type: resistor
    name: R1
    nodes: [in, n_l]
    value: 0.1
  - type: inductor
    name: L1
    nodes: [n_l, out]
    value: 1e-3
    ic: 0.0
  - type: capacitor
    name: C1
    nodes: [out, 0]
    value: 1e-6
    ic: 0.0
