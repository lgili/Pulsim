schema: pulsim-v1
version: 1
benchmark:
  id: driven_lc_series_resonance
  category: linear
  observables:
    - column: V(out)
  expectations:
    metrics:
      # Series RLC driven at resonance.
      #   L = 1 mH, C = 1 µF, R = 10 Ω
      #   ω_0 = 1/sqrt(LC) = 31623 rad/s, f_0 = 5033 Hz, T_0 = 199 µs
      #   Q = (1/R)·sqrt(L/C) = 0.1 · sqrt(1000) = 3.162
      # Driven by V_in = 1 V sine at f_0. Steady-state |V_C| ≈ Q·V_in
      # = 3.16 V (resonant amplification across the capacitor).
      # Transient settles in ~Q periods ≈ 0.6 ms.
      # Sample-grid timing between Pulsim trbdf2 and ngspice trap leaves
      # ~30 mV mismatch on the 3.16 V peak (1%).
      max_error: 5e-2
  validation:
    type: reference
    observable: V(out)
    baseline: baselines/driven_lc_series_resonance.csv
# Series RLC driven by a sine at the natural frequency. Validates the
# AC-driven 2nd-order response and resonant amplification (V_C peak
# exceeds V_in by Q). Complements the lossless `lc_resonant_tank`
# (which is IC-driven) by adding damping + steady-state forcing.
simulation:
  tstop: 20e-3
  dt: 2e-6
  integrator: trbdf2
  uic: true
components:
  - type: voltage_source
    name: Vac
    nodes: [in, 0]
    waveform:
      type: sine
      amplitude: 1.0
      frequency: 5033.0
      offset: 0.0
      phase: 0.0
  - type: resistor
    name: R1
    nodes: [in, n_l]
    value: 10.0
  - type: inductor
    name: L1
    nodes: [n_l, out]
    value: 1e-3
    ic: 0.0
  - type: capacitor
    name: C1
    nodes: [out, 0]
    value: 1e-6
    ic: 0.0
