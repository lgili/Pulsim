schema: pulsim-v1
version: 1
benchmark:
  id: motor_bldc_six_step
  category: motor
  observables:
    - column: V(vdc_pos)
  expectations:
    metrics:
      max_error: 5.0e-2
      steady_state_max_error: 5.0e-2
  validation:
    type: none
simulation:
  tstart: 0.0
  tstop: 5e-3
  dt: 5e-6
  adaptive_timestep: false
  integrator: trapezoidal
  uic: true
components:
  # consolidate-motors-and-three-phase Phase D benchmark: BLDC motor
  # locked-rotor smoke. The motor's mechanical state is pinned at
  # omega_init = 0 (locked) and theta_init = 0 (rotor angle); the DC
  # voltage source on phase A reaches a steady-state phase-A current
  # bounded by R_s + L_s impedance.
  #
  # This benchmark validates that:
  #   1. The `bldc_motor` YAML type dispatches to BldcMotorDevice.
  #   2. The trapezoidal-back-EMF stamping integrates cleanly with
  #      MNA primitives.
  #   3. Phase B / C currents reach near-zero (open-circuit) while
  #      phase A current builds toward the steady-state value
  #      I_ss ≈ V_a / R_s = 12 / 0.5 = 24 A (no back-EMF at ω=0).
  #
  # Full six-step commutation with a rotating reference and KPI
  # extraction lands in a follow-up benchmark PR — that needs the
  # observable plumbing to expose `bldc_i_a/_b/_c` as columns.

  - type: voltage_source
    name: V_a
    nodes: [vdc_pos, 0]
    waveform: {type: dc, value: 12.0}

  - type: bldc_motor
    name: M1
    nodes: [vdc_pos, vdc_neg, vdc_neg, 0]
    R_s: 0.5
    L_s: 1e-3
    K_e_peak: 0.05
    pole_pairs: 4
    J: 1e-4
    b_friction: 1e-5
    omega_init: 0.0
    theta_init: 0.0
