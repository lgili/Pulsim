schema: pulsim-v1
version: 1
benchmark:
  id: voltage_divider_3stage
  category: linear
  observables:
    - column: V(n_mid)
  expectations:
    metrics:
      # 12 V DC source, R1 = 100, R2 = 200, R3 = 300 in series to ground.
      # I = 12 / (100+200+300) = 20 mA.
      # V(n_mid) = node between R1 and R2 = 12 - I·R1 = 12 - 0.02·100 = 10 V.
      # V(n_low) = node between R2 and R3 = V(n_mid) - I·R2 = 10 - 4 = 6 V.
      # Pure DC OP; both simulators settle in 1 sample. Sub-µV match.
      max_error: 1e-5
  validation:
    type: reference
    observable: V(n_mid)
    baseline: baselines/voltage_divider_3stage.csv
# 3-resistor series voltage divider. Trivial DC OP — tests pure
# resistive MNA across 4 internal nodes. Useful sanity check that
# the linear solver handles small-but-non-trivial networks correctly.
simulation:
  tstop: 1e-3
  dt: 5e-6
components:
  - type: voltage_source
    name: Vsrc
    nodes: [vcc, 0]
    waveform:
      type: dc
      value: 12.0
  - type: resistor
    name: R1
    nodes: [vcc, n_mid]
    value: 100.0
  - type: resistor
    name: R2
    nodes: [n_mid, n_low]
    value: 200.0
  - type: resistor
    name: R3
    nodes: [n_low, 0]
    value: 300.0
