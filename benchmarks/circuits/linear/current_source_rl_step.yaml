schema: pulsim-v1
version: 1
benchmark:
  id: current_source_rl_step
  category: linear
  observables:
    - column: V(out)
  expectations:
    metrics:
      # Pure linear circuit, analytical reference. Pulsim's first-order
      # Trapezoidal integrator should match the exponential decay to
      # numerical noise level. 1 mV on a 1 V swing = 0.1%.
      max_error: 1e-3
  validation:
    type: analytical
    model: rl_step
    observable: V(out)
    # Skip the t=0 sample: Pulsim records V(0) = 0 (pre-source IC),
    # but the analytical step expects V(0+) = I·R = 1 V (post-step).
    # The exponential is matched cleanly from sample 1 onward.
    ignore_initial_samples: 1
    params:
      v0: 1.0      # V(0+) = I·R = 0.010 · 100 = 1.0 V
      r: 100.0
      l: 10e-3
# Current source feeding R || L parallel combination. With UIC and
# inductor IC=0, all source current initially flows through R giving
# V(0+) = I·R = 1 V. As i_L ramps up, V decays exponentially:
#   V(t) = I·R · exp(-t · R/L), τ = L/R = 100 µs.
# Tstop = 1 ms = 10·τ → settles to numerical zero.
simulation:
  tstop: 1e-3
  dt: 5e-6
  uic: true
components:
  - type: current_source
    name: I1
    nodes: [out, 0]    # Pulsim convention: positive value pushes
                       # current INTO npos (out) — same physics as
                       # ngspice `I1 0 out DC 10m` (their npos/nneg
                       # roles are mirrored).
    value: 10e-3
  - type: resistor
    name: R1
    nodes: [out, 0]
    value: 100.0
  - type: inductor
    name: L1
    nodes: [out, 0]
    value: 10e-3
    ic: 0.0
