schema: pulsim-v1
version: 1
benchmark:
  id: current_divider_3way
  category: linear
  observables:
    - column: V(node)
  expectations:
    metrics:
      # Pure DC: 3 resistors in parallel between [node] and [0], fed by
      # 30 mA. V = I · (R1||R2||R3) = I · 1/(1/100 + 1/200 + 1/300)
      # = 0.030 · 54.545 = 1.6364 V steady-state.
      # No dynamics — once Pulsim and ngspice agree on DC OP, the rest
      # of the transient is just numerical noise around steady-state.
      max_error: 5e-4
  validation:
    type: reference
    observable: V(node)
    baseline: baselines/current_divider_3way.csv
# DC current source feeding 3 parallel resistors. Tests:
#   - Current source path (different DC OP from voltage source dual)
#   - Multi-branch resistive network on a single node
#   - Trivial transient (immediate steady-state)
simulation:
  tstop: 1e-3
  dt: 5e-6
components:
  - type: current_source
    name: I1
    nodes: [node, 0]
    value: 30e-3
  - type: resistor
    name: R1
    nodes: [node, 0]
    value: 100.0
  - type: resistor
    name: R2
    nodes: [node, 0]
    value: 200.0
  - type: resistor
    name: R3
    nodes: [node, 0]
    value: 300.0
