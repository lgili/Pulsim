schema: pulsim-v1
version: 1
benchmark:
  id: rl_natural_response
  category: linear
  observables:
    - column: V(node)
  expectations:
    metrics:
      # Pre-charged inductor (i_L IC = 0.1 A) discharging through R.
      # No source — pure IC-driven response. V(node) = -i_L · R, with
      # i_L(t) = I_0 · exp(-t·R/L). So V(node) starts at -0.1 · 100
      # = -10 V and decays toward 0.
      # τ = L/R = 100 µs.
      max_error: 1e-3
  validation:
    type: analytical
    model: rl_step
    observable: V(node)
    ignore_initial_samples: 1
    params:
      v0: -10.0
      r: 100.0
      l: 10e-3
# IC-only test: no voltage / current source. The inductor's IC
# (i_L = 0.1 A) drives the entire transient. Validates that the
# UIC path actually seeds the inductor state and that the natural
# response decays correctly.
simulation:
  tstop: 1e-3
  dt: 5e-6
  integrator: trbdf2
  uic: true
components:
  - type: inductor
    name: L1
    nodes: [node, 0]
    value: 10e-3
    ic: 0.1         # 100 mA flowing from "node" to "0" at t=0
  - type: resistor
    name: R1
    nodes: [node, 0]
    value: 100.0
