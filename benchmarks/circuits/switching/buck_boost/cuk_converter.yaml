schema: pulsim-v1
version: 1
benchmark:
  id: cuk_converter
  category: nonlinear
  observables:
    - column: V(out)
  expectations:
    metrics:
      # Cuk converter: dual to the SEPIC but produces INVERTED
      # output. Topology:
      #   V_in → L1 → A (switch midpoint)
      #         switch (low-side): A → 0
      #         C_coupling (energy transfer): A → B
      #         L2: B → out
      #         diode: B → 0 (anode at B, cathode at 0; it carries
      #           i_L1 + i_L2 while the switch is off)
      #         C_out + R_load on out (out is NEGATIVE)
      # Duty: 0.5 minus the 200 ns dead time = 0.49. In CCM V_out would
      # be −V_in·D/(1−D) = −11.5 V, but this design runs in DCM:
      # K = 2·(L1‖L2)/(R·T) = 2·23.5 µH/(20 Ω·20 µs) = 0.1175 is below
      # K_crit = (1−D)² = 0.26, so V_out = −V_in·D/√K = −17.15 V. The
      # run ends before steady state: −17.4 V over 1.5–2 ms, settling to
      # −17.06 V (pwl, 8–20 ms; g_on and g_off losses).
      max_error: 1.0e+1
      steady_state_max_error: 8.0e-1
simulation:
  tstart: 0.0
  tstop: 2.0e-3
  dt: 0.2e-6
  dt_max: 1e-6
  adaptive_timestep: false
  integrator: bdf1
  enable_events: false
  uic: true
  max_step_retries: 8
  newton:
    max_iterations: 220
    initial_damping: 0.5
    min_damping: 1e-4
    auto_damping: true
  fallback:
    trace_retries: true
    enable_transient_gmin: true
    gmin_retry_threshold: 1
    gmin_initial: 1e-8
    gmin_max: 1e-4
    gmin_growth: 10
components:
  - type: voltage_source
    name: Vin
    nodes: [vin, 0]
    waveform:
      type: dc
      value: 12.0
  - type: voltage_source
    name: Vg
    nodes: [gate, 0]
    waveform:
      type: pwm
      v_high: 10.0
      v_low: 0.0
      frequency: 50000
      duty: 0.5
      dead_time: 200e-9
  - type: inductor
    name: L1
    nodes: [vin, sw_node]
    value: 47e-6
    ic: 0.0
  - type: vcswitch
    name: S1
    nodes: [gate, sw_node, 0]
    v_threshold: 5.0
    g_on: 200.0
    g_off: 1e-6
  # Energy transfer cap, pre-charged to V_in − V_out = 24 V
  - type: capacitor
    name: Ccpl
    nodes: [sw_node, mid]
    value: 22e-6
    ic: 24.0
  - type: inductor
    name: L2
    nodes: [mid, out]
    value: 47e-6
    ic: 0.0
  # Output diode: anode at mid, cathode at ground. With the switch on,
  # mid sits at −V_Ccpl (diode reverse-biased); with it off, i_L1 +
  # i_L2 flows through it (the file had it reversed until 2026-11).
  - type: diode
    name: Drect
    nodes: [mid, 0]
    g_on: 200.0
    g_off: 1e-6
  - type: capacitor
    name: Cout
    nodes: [out, 0]
    value: 47e-6
    ic: 0.0
  - type: resistor
    name: Rload
    nodes: [out, 0]
    value: 20.0
