schema: pulsim-v1
version: 1
benchmark:
  id: pwm_voltage_rl_filter
  category: linear
  observables:
    - column: V(out)
  expectations:
    metrics:
      # PWM source at 10 kHz (T_sw = 100 µs) feeds R + L. L/R = 1 ms,
      # so the filter is 10× slower than the switching period →
      # output current averages to D · V_in / R.
      # Observable V(out) = V across L = V_in - i_L · R. Settles around
      # mean = 0.5 · 5 V = 2.5 V with ±~1 V ripple. 100 mV match between
      # Pulsim trbdf2 and ngspice trap on the ripple.
      max_error: 1.5e-1
  validation:
    type: reference
    observable: V(out)
    baseline: baselines/pwm_voltage_rl_filter.csv
# PWM voltage source → R → L (output to ground). Tests:
#   - PWM waveform engine (pwm_voltage_source path)
#   - Series RL averaging behavior under switched input
#   - Inductor handling at the switching commutations
simulation:
  tstop: 3e-3
  dt: 1e-6
  integrator: trbdf2
  uic: true
components:
  - type: voltage_source
    name: Vpwm
    nodes: [in, 0]
    waveform:
      type: pwm
      v_high: 5.0
      v_low: 0.0
      frequency: 10000.0
      duty: 0.5
  - type: resistor
    name: R1
    nodes: [in, n_l]
    value: 100.0
  - type: inductor
    name: L1
    nodes: [n_l, out]
    value: 10e-3
    ic: 0.0
  - type: resistor
    name: Rload
    nodes: [out, 0]
    value: 1.0
