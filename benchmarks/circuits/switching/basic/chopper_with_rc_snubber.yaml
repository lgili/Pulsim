schema: pulsim-v1
version: 1
benchmark:
  id: chopper_with_rc_snubber
  category: switching
  observables:
    - column: V(sw)
  expectations:
    metrics:
      # Same topology as the previously-removed `chopper_inductive_freewheel`
      # but WITH an RC snubber across the switch (R_sn = 10 Ω, C_sn = 100 nF).
      # The snubber's job is to absorb the inductive commutation transient.
      # HYPOTHESIS: if snubber fixes the ±5 kV ringing that batch-3
      # exposed, this PASSES and we've localized the issue to "missing
      # snubber on ideal switching". If it STILL diverges, the bug is
      # deeper in Pulsim's vcswitch / diode commutation handling.
      max_error: 2.0
  validation:
    type: reference
    observable: V(sw)
    baseline: baselines/chopper_with_rc_snubber.csv
# Same chopper that previously diverged (vcswitch + L + freewheel diode)
# but with an RC snubber across the switch. Diagnostic to localize the
# previous numerical issue.
simulation:
  tstop: 1.5e-3
  dt: 100e-9
  integrator: trbdf2
  uic: true
components:
  - type: voltage_source
    name: Vcc
    nodes: [vcc, 0]
    waveform:
      type: dc
      value: 20.0
  - type: voltage_source
    name: Vctrl
    nodes: [ctrl, 0]
    waveform:
      type: pwm
      v_high: 10.0
      v_low: 0.0
      frequency: 5000.0
      duty: 0.5
  - type: vcswitch
    name: S1
    nodes: [ctrl, vcc, sw]
    v_threshold: 5.0
    g_on: 200.0
    g_off: 1e-6
  - type: diode
    name: Dfw
    nodes: [0, sw]
    g_on: 200.0
    g_off: 1e-6
  - type: inductor
    name: L1
    nodes: [sw, out]
    value: 1e-3
    ic: 0.0
  - type: resistor
    name: Rload
    nodes: [out, 0]
    value: 10.0
  # RC snubber across the switch (sw → vcc, in parallel with S1).
  - type: resistor
    name: Rsn
    nodes: [sw, n_sn]
    value: 10.0
  - type: capacitor
    name: Csn
    nodes: [n_sn, vcc]
    value: 100e-9
    ic: 0.0
