schema: pulsim-v1
version: 1
benchmark:
  id: llc_half_bridge_zvs
  category: soft_switching
  description: >
    LLC half-bridge with a linear C_oss (200 pF) and a body diode across each
    switch, 300 ns dead time, f_s = 125 kHz below f_r = 132.6 kHz (L_r = 60 uH,
    C_r = 24 nF), L_m = 300 uH, the rectified load as its
    first-harmonic equivalent R_ac = 150 Ohm across L_m (the commutation is
    on the primary; chosen while the exact tool could not settle a
    transformer-coupled rectifier, F-S-3, since fixed: the PSFB has one).
    Truth: benchmarks/tools/exact_truth.py (independent mpmath engine); the
    ZVS check is python/tests/test_soft_switching_validation.py.
  observables:
    - column: V(mid)
    - column: I(Lr)
  # Probe convention: docs/SOFT_SWITCHING.md (V_DS positive terminal first, I_D = I(switch)).
  # The window after each edge is shorter than the 300 ns dead time, so it ends before the next edge.
  # Baseline: the exact truth (benchmarks/tools/soft_switching_truth.py baseline, mpmath;
  # never a Pulsim run) on the 10 ns grid, both limits at every event, with V_DS and I_D of
  # every switch. 0.7 V = the baseline's linear interpolation between its rows on the
  # dead-time ramp, max (h^2/8)|v''| = 0.19 V, + the 0.5 V each engine sample is held to
  # against the exact truth (test_soft_switching_validation.py). From 50 ns: a 10 ns row
  # cannot follow a start transient of picoseconds (and trbdf2's first fs on the PSFB, F-S-5).
  # The plain fixed engine (default scenario) is a known disagreement (trap 9, v2_triage).
  expectations:
    metrics:
      max_error: 0.7
  validation:
    type: reference
    observable: V(mid)
    baseline: baselines/llc_half_bridge_zvs.csv
    start_time: 50e-9
  kpi:
    - {metric: zvs_fraction, switch_observable: V(g_hi), voltage_observable: "V(vin,mid)", threshold_v: 5.0, lookback_samples: 1, label: S_hi}
    - {metric: switching_loss, switch_observable: V(g_hi), voltage_observable: "V(vin,mid)", current_observable: I(S_hi), window_s: 100e-9, label: S_hi}
    - {metric: zvs_fraction, switch_observable: V(g_lo), voltage_observable: "V(mid)", threshold_v: 5.0, lookback_samples: 1, label: S_lo}
    - {metric: switching_loss, switch_observable: V(g_lo), voltage_observable: "V(mid)", current_observable: I(S_lo), window_s: 100e-9, label: S_lo}
simulation:
  tstart: 0.0
  tstop: 40e-6
  dt: 10e-9
  uic: true
components:
  - {type: voltage_source, name: Vdc, nodes: [vin, 0], waveform: {type: dc, value: 400.0}}
  - type: voltage_source
    name: Vg_hi
    nodes: [g_hi, 0]
    waveform: {type: pwm, v_high: 10.0, v_low: 0.0, frequency: 125000, duty: 0.5, dead_time: 300e-9, phase: 0.0}
  - type: voltage_source
    name: Vg_lo
    nodes: [g_lo, 0]
    waveform: {type: pwm, v_high: 10.0, v_low: 0.0, frequency: 125000, duty: 0.5, dead_time: 300e-9, phase: 0.5}
  - {type: vcswitch, name: S_hi, nodes: [g_hi, vin, mid], v_threshold: 5.0, g_on: 1000.0, g_off: 1e-9}
  - {type: vcswitch, name: S_lo, nodes: [g_lo, mid, 0], v_threshold: 5.0, g_on: 1000.0, g_off: 1e-9}
  - {type: diode, name: D_hi, nodes: [mid, vin], g_on: 1000.0, g_off: 1e-9}
  - {type: diode, name: D_lo, nodes: [0, mid], g_on: 1000.0, g_off: 1e-9}
  - {type: capacitor, name: Coss_hi, nodes: [vin, mid], value: 200e-12, ic: 400.0}
  - {type: capacitor, name: Coss_lo, nodes: [mid, 0], value: 200e-12, ic: 0.0}
  - {type: capacitor, name: Cr, nodes: [mid, a], value: 24e-9}
  - {type: inductor, name: Lr, nodes: [a, p], value: 60e-6}
  - {type: inductor, name: Lm, nodes: [p, 0], value: 300e-6}
  - {type: resistor, name: Rac, nodes: [p, 0], value: 150.0}
