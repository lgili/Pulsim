schema: pulsim-v1
version: 1
benchmark:
  id: capacitor_natural_discharge
  category: linear
  observables:
    - column: V(node)
  expectations:
    metrics:
      # Pre-charged cap (V_C IC = 5 V) discharging through R = 1 kΩ.
      # τ = RC = 1 kΩ · 1 µF = 1 ms.
      # V(t) = 5 · exp(-t/1ms).
      # Pure linear IC-driven. Dual of rl_natural_response.
      max_error: 1e-3
  validation:
    type: analytical
    model: rl_step
    observable: V(node)
    # Pulsim records V(0) = 0 (pre-IC sample), analytical assumes V(0+) = 5 V.
    # Skip first sample.
    ignore_initial_samples: 1
    params:
      v0: 5.0
      r: 1000.0   # τ-equivalent: rl_step gives V0·exp(-t·R/L);
      l: 1.0      # we encode τ = L/R = 1/1000 = 1 ms via L=1, R=1000.
# IC-only test: no voltage / current source. Pre-charged capacitor
# (V_C = 5 V at t=0) discharges through a resistor. Validates that
# the UIC path seeds the capacitor voltage state correctly, and
# tests the symmetric counterpart to `rl_natural_response`.
simulation:
  tstop: 5e-3
  dt: 5e-6
  integrator: trbdf2
  uic: true
components:
  - type: capacitor
    name: C1
    nodes: [node, 0]
    value: 1e-6
    ic: 5.0       # 5 V across cap at t=0 (V(node) = 5V initially)
  - type: resistor
    name: R1
    nodes: [node, 0]
    value: 1000.0
